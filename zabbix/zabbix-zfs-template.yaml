zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: e5cc588e59564dd5a08ce6a3f16a44d9
      name: Templates/Storage
  templates:
    - uuid: 504a4b6fc42f4c9b94fd7ec763221781
      template: 'ZFS by Zabbix agent active'
      name: 'ZFS by Zabbix agent active'
      description: 'Read-only OpenZFS monitoring through the private-cloud Agent 2 collectors.'
      groups:
        - name: Templates/Storage
      items:
        - uuid: 5ea421b42fee4eec9ac12cc8cdde64a0
          name: 'ZFS: Metrics JSON'
          type: ZABBIX_ACTIVE
          key: zfs.metrics
          delay: 1m
          timeout: 30s
          history: '0'
          trends: '0'
          value_type: TEXT
          tags:
            - tag: component
              value: raw
        - uuid: 9b6bad59af6d401ebd59f2ecefb306af
          name: 'ZFS: Collector errors'
          type: DEPENDENT
          key: zfs.collector.errors
          delay: '0'
          history: 30d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error_count
          master_item:
            key: zfs.metrics
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: ee4bc2be30f3404aa7670c9dd99b50db
              expression: 'last(/ZFS by Zabbix agent active/zfs.collector.errors)>0'
              name: 'ZFS collector reports errors'
              priority: HIGH
        - uuid: fa4578081b4744b8bdbdb0fd7ac5d3e3
          name: 'ZFS: Metrics heartbeat'
          type: DEPENDENT
          key: zfs.metrics.heartbeat
          delay: '0'
          history: 7d
          units: unixtime
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.generated_at
          master_item:
            key: zfs.metrics
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 01e8b6d0010246558db5179557527a08
              expression: 'nodata(/ZFS by Zabbix agent active/zfs.metrics.heartbeat,5m)=1'
              name: 'No ZFS metrics received for 5 minutes'
              priority: HIGH
        - uuid: 41476b7eb9a4446db70f22d245cc90b8
          name: 'ZFS: Snapshot metrics JSON'
          type: ZABBIX_ACTIVE
          key: zfs.snapshots
          delay: 15m
          timeout: 30s
          history: '0'
          trends: '0'
          value_type: TEXT
          tags:
            - tag: component
              value: raw
        - uuid: c9f2f186cad64de893108795c60d1971
          name: 'ZFS: Snapshot collector errors'
          type: DEPENDENT
          key: zfs.snapshot.collector.errors
          delay: '0'
          history: 30d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error_count
          master_item:
            key: zfs.snapshots
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: ce8bdb23e6ed4665aa7d8aca548af16c
              expression: 'last(/ZFS by Zabbix agent active/zfs.snapshot.collector.errors)>0'
              name: 'ZFS snapshot collector reports errors'
              priority: HIGH
        - uuid: a8a6e94c3fd34818b791bc71c0b52b68
          name: 'ZFS: Snapshot metrics heartbeat'
          type: DEPENDENT
          key: zfs.snapshots.heartbeat
          delay: '0'
          history: 7d
          units: unixtime
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.generated_at
          master_item:
            key: zfs.snapshots
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: b98cf73f3a6d49a0b3e94b52ae9ba7c2
              expression: 'nodata(/ZFS by Zabbix agent active/zfs.snapshots.heartbeat,30m)=1'
              name: 'No ZFS snapshot metrics received for 30 minutes'
              priority: WARNING
        - uuid: 268483d2cbbe4adfb427d914e1a46ed2
          name: 'ZFS: Total snapshots'
          type: DEPENDENT
          key: zfs.snapshots.total
          delay: '0'
          history: 90d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.total_count
          master_item:
            key: zfs.snapshots
          tags:
            - tag: component
              value: snapshots
        - uuid: f83c5e2d849e4f54b6e3de686a2acbe2
          name: 'ZFS ARC: Size'
          type: DEPENDENT
          key: zfs.arc.size
          delay: '0'
          history: 30d
          units: B
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.arc.size
          master_item:
            key: zfs.metrics
          tags:
            - tag: component
              value: arc
        - uuid: c5c76d53b1b14e6fa10f673706f5341d
          name: 'ZFS ARC: Target size'
          type: DEPENDENT
          key: zfs.arc.target_size
          delay: '0'
          history: 30d
