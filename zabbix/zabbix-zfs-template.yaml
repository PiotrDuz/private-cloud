              expression: 'last(/ZFS by Zabbix agent active/zfs.snapshot.collector.errors)>0'
              name: 'ZFS snapshot collector reports errors'
              priority: HIGH
        - uuid: a8a6e94c3fd34818b791bc71c0b52b68
          name: 'ZFS: Snapshot metrics heartbeat'
          type: DEPENDENT
          key: zfs.snapshots.heartbeat
