zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: e5cc588e59564dd5a08ce6a3f16a44d9
      name: Templates/Storage
  templates:
    - uuid: 504a4b6fc42f4c9b94fd7ec763221781
      template: 'ZFS by Zabbix agent active'
      name: 'ZFS by Zabbix agent active'
      description: 'Read-only OpenZFS monitoring through the private-cloud Agent 2 collectors.'
      groups:
        - name: Templates/Storage
      items:
        - uuid: 5ea421b42fee4eec9ac12cc8cdde64a0
          name: 'ZFS: Metrics JSON'
          type: ZABBIX_ACTIVE
          key: zfs.metrics
          delay: 1m
          timeout: 30s
          history: '0'
          trends: '0'
          value_type: TEXT
          tags:
            - tag: component
              value: raw
        - uuid: 9b6bad59af6d401ebd59f2ecefb306af
          name: 'ZFS: Collector errors'
          type: DEPENDENT
          key: zfs.collector.errors
          delay: '0'
          history: 30d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error_count
          master_item:
            key: zfs.metrics
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: ee4bc2be30f3404aa7670c9dd99b50db
              expression: 'last(/ZFS by Zabbix agent active/zfs.collector.errors)>0'
              name: 'ZFS collector reports errors'
              priority: HIGH
        - uuid: fa4578081b4744b8bdbdb0fd7ac5d3e3
          name: 'ZFS: Metrics heartbeat'
          type: DEPENDENT
          key: zfs.metrics.heartbeat
          delay: '0'
          history: 7d
          units: unixtime
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.generated_at
          master_item:
            key: zfs.metrics
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 01e8b6d0010246558db5179557527a08
              expression: 'nodata(/ZFS by Zabbix agent active/zfs.metrics.heartbeat,5m)=1'
              name: 'No ZFS metrics received for 5 minutes'
              priority: HIGH
        - uuid: 41476b7eb9a4446db70f22d245cc90b8
          name: 'ZFS: Snapshot metrics JSON'
          type: ZABBIX_ACTIVE
          key: zfs.snapshots
          delay: 15m
          timeout: 30s
          history: '0'
          trends: '0'
          value_type: TEXT
          tags:
            - tag: component
              value: raw
        - uuid: c9f2f186cad64de893108795c60d1971
          name: 'ZFS: Snapshot collector errors'
          type: DEPENDENT
          key: zfs.snapshot.collector.errors
          delay: '0'
          history: 30d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error_count
          master_item:
            key: zfs.snapshots
          tags:
            - tag: component
