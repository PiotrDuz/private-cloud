                - $.arc.hit_ratio
          master_item:
            key: zfs.metrics
          tags:
            - tag: component
              value: arc
        - uuid: cbbdfd3c9f6546118e286b139e1f978f
          name: 'ZFS ARC: Metadata used'
          type: DEPENDENT
          key: zfs.arc.metadata_used
          delay: '0'
          history: 30d
          units: B
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.arc.metadata_used
          master_item:
            key: zfs.metrics
          tags:
            - tag: component
              value: arc
        - uuid: 0a4a96b5d4934aa882cd8770f7398f3c
          name: 'ZFS ARC: Maximum size'
          type: DEPENDENT
          key: zfs.arc.maximum_size
          delay: '0'
          history: 30d
          units: B
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.arc.maximum_size
          master_item:
            key: zfs.metrics
          tags:
            - tag: component
              value: arc
        - uuid: 584451a0ebc64bcc8321dd9218cf9df6
          name: 'ZFS ARC: Metadata limit'
          type: DEPENDENT
          key: zfs.arc.metadata_limit
          delay: '0'
          history: 30d
          units: B
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.arc.metadata_limit
          master_item:
            key: zfs.metrics
          tags:
            - tag: component
              value: arc
        - uuid: f9072830887142bea957858d39ec10a9
          name: 'ZFS L2ARC: Size'
          type: DEPENDENT
          key: zfs.l2arc.size
          delay: '0'
          history: 30d
          units: B
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.arc.l2_size
          master_item:
            key: zfs.metrics
          tags:
            - tag: component
              value: l2arc
        - uuid: 25f14bf08da1479f984591ca5360128f
          name: 'ZFS L2ARC: Hit ratio'
          type: DEPENDENT
          key: zfs.l2arc.hit_ratio
          delay: '0'
          history: 30d
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.arc.l2_hit_ratio
          master_item:
            key: zfs.metrics
          tags:
            - tag: component
              value: l2arc
        - uuid: fd8b1f24f6f340ba8bd459d2e9e4f297
          name: 'ZFS L2ARC: I/O errors'
          type: DEPENDENT
          key: zfs.l2arc.errors.io
          delay: '0'
          history: 90d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.arc.l2_io_errors
          master_item:
            key: zfs.metrics
          tags:
            - tag: component
              value: errors
          triggers:
            - uuid: d8a97541c4744f738744323580229e0f
              expression: 'last(/ZFS by Zabbix agent active/zfs.l2arc.errors.io)>0'
              name: 'ZFS L2ARC has I/O errors'
              priority: HIGH
        - uuid: 042dbb39bf3141fab90b1ff6b61d5810
          name: 'ZFS L2ARC: Checksum errors'
          type: DEPENDENT
          key: zfs.l2arc.errors.checksum
          delay: '0'
          history: 90d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.arc.l2_checksum_errors
          master_item:
            key: zfs.metrics
          tags:
            - tag: component
              value: errors
          triggers:
            - uuid: 3d34041c3b3347c49a4b1275617d01ad
              expression: 'last(/ZFS by Zabbix agent active/zfs.l2arc.errors.checksum)>0'
              name: 'ZFS L2ARC has checksum errors'
              priority: HIGH
      discovery_rules:
        - uuid: 214f60db809d4f20af09eeaa051b281d
          name: 'ZFS pool discovery'
          type: DEPENDENT
          key: zfs.pool.discovery
          delay: '0'
          lifetime: 7d
          item_prototypes:
            - uuid: efd8ec0db060455ba4cf855c96f7a69d
              name: 'Pool {#POOL.NAME}: Health'
              type: DEPENDENT
              key: 'zfs.pool.health["{#POOL.NAME}"]'
              delay: '0'
              history: 90d
              value_type: CHAR
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["health"]'
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: pool
                - tag: pool
                  value: '{#POOL.NAME}'
            - uuid: f3f8eb76441e43dd97156f230d18e9d7
              name: 'Pool {#POOL.NAME}: Online'
              type: DEPENDENT
              key: 'zfs.pool.online["{#POOL.NAME}"]'
              delay: '0'
              history: 90d
              valuemap:
                name: 'ZFS yes/no'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["online"]'
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: pool
                - tag: pool
                  value: '{#POOL.NAME}'
              trigger_prototypes:
                - uuid: f546191712c641a78480556e5e7f3d19
                  expression: 'last(/ZFS by Zabbix agent active/zfs.pool.online["{#POOL.NAME}"])<>1'
                  name: 'ZFS pool {#POOL.NAME} is not online'
                  priority: DISASTER
            - uuid: 72973772caf34f658532cf46c1807952
              name: 'Pool {#POOL.NAME}: Size'
              type: DEPENDENT
              key: 'zfs.pool.size["{#POOL.NAME}"]'
              delay: '0'
              history: 30d
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["size"]'
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: pool
            - uuid: 397364f3e02c4da18612112932383857
              name: 'Pool {#POOL.NAME}: Allocated'
              type: DEPENDENT
              key: 'zfs.pool.allocated["{#POOL.NAME}"]'
              delay: '0'
              history: 30d
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["allocated"]'
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: pool
            - uuid: a69a252a7ed4493080ad2cb321312d08
              name: 'Pool {#POOL.NAME}: Free'
              type: DEPENDENT
              key: 'zfs.pool.free["{#POOL.NAME}"]'
              delay: '0'
              history: 30d
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["free"]'
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: pool
            - uuid: 23c01c22143444c098d120655178ccda
              name: 'Pool {#POOL.NAME}: Capacity'
              type: DEPENDENT
              key: 'zfs.pool.capacity["{#POOL.NAME}"]'
              delay: '0'
              history: 30d
              units: '%'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["capacity"]'
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: pool
              trigger_prototypes:
                - uuid: 764c619524264e2c9b3b71b19ffdfd72
                  expression: 'min(/ZFS by Zabbix agent active/zfs.pool.capacity["{#POOL.NAME}"],10m)>={$ZFS.POOL.CAPACITY.HIGH}'
                  name: 'ZFS pool {#POOL.NAME} capacity is high'
                  priority: HIGH
                - uuid: 443667cba8b44d55acdc5a7768df906a
                  expression: 'min(/ZFS by Zabbix agent active/zfs.pool.capacity["{#POOL.NAME}"],10m)>={$ZFS.POOL.CAPACITY.WARN}'
                  name: 'ZFS pool {#POOL.NAME} capacity is elevated'
                  priority: WARNING
                  dependencies:
                    - name: 'ZFS pool {#POOL.NAME} capacity is high'
                      expression: 'min(/ZFS by Zabbix agent active/zfs.pool.capacity["{#POOL.NAME}"],10m)>={$ZFS.POOL.CAPACITY.HIGH}'
            - uuid: 1af3260926464104a858e80e4204f28b
              name: 'Pool {#POOL.NAME}: Fragmentation'
              type: DEPENDENT
              key: 'zfs.pool.fragmentation["{#POOL.NAME}"]'
              delay: '0'
              history: 30d
              units: '%'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["fragmentation"]'
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: pool
            - uuid: bc538fb92605438cad07141ae5b1597a
              name: 'Pool {#POOL.NAME}: Deduplication ratio'
              type: DEPENDENT
              key: 'zfs.pool.dedup_ratio["{#POOL.NAME}"]'
              delay: '0'
              history: 30d
              value_type: FLOAT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["dedup_ratio"]'
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: pool
            - uuid: 9ed33fb93bec445fb68374e8fac901d6
              name: 'Pool {#POOL.NAME}: Read errors'
              type: DEPENDENT
              key: 'zfs.pool.errors.read["{#POOL.NAME}"]'
              delay: '0'
              history: 90d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["read_errors"]'
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: errors
              trigger_prototypes:
                - uuid: eda8f6f38acc49f9a17768917854db93
                  expression: 'last(/ZFS by Zabbix agent active/zfs.pool.errors.read["{#POOL.NAME}"])>0'
                  name: 'ZFS pool {#POOL.NAME} has read errors'
                  priority: HIGH
            - uuid: 88192cd038fd43f6bab1128917e93bcf
              name: 'Pool {#POOL.NAME}: Write errors'
              type: DEPENDENT
              key: 'zfs.pool.errors.write["{#POOL.NAME}"]'
              delay: '0'
              history: 90d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["write_errors"]'
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: errors
              trigger_prototypes:
                - uuid: 8867841d4047487fbda610d509a4deda
                  expression: 'last(/ZFS by Zabbix agent active/zfs.pool.errors.write["{#POOL.NAME}"])>0'
                  name: 'ZFS pool {#POOL.NAME} has write errors'
                  priority: HIGH
            - uuid: 2551d66846f241d98dacd2487ee5b177
              name: 'Pool {#POOL.NAME}: Checksum errors'
              type: DEPENDENT
              key: 'zfs.pool.errors.checksum["{#POOL.NAME}"]'
              delay: '0'
              history: 90d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["checksum_errors"]'
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: errors
              trigger_prototypes:
                - uuid: 59317d1bb40e4870a17185017ea502b9
                  expression: 'last(/ZFS by Zabbix agent active/zfs.pool.errors.checksum["{#POOL.NAME}"])>0'
                  name: 'ZFS pool {#POOL.NAME} has checksum errors'
                  priority: HIGH
            - uuid: b6430bfe1f684279b7867ffeb7113813
              name: 'Pool {#POOL.NAME}: Permanent errors present'
              type: DEPENDENT
              key: 'zfs.pool.errors.permanent["{#POOL.NAME}"]'
              delay: '0'
              history: 90d
              valuemap:
                name: 'ZFS yes/no'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["permanent_errors"]'
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: errors
              trigger_prototypes:
                - uuid: e619691c4de249f1a12ef8bb95b20bf0
                  expression: 'last(/ZFS by Zabbix agent active/zfs.pool.errors.permanent["{#POOL.NAME}"])>0'
                  name: 'ZFS pool {#POOL.NAME} has permanent data errors'
                  priority: DISASTER
            - uuid: 1f692182af7a43e4940ce605e6b28de8
              name: 'Pool {#POOL.NAME}: Scrub active'
              type: DEPENDENT
              key: 'zfs.pool.scrub.active["{#POOL.NAME}"]'
              delay: '0'
              history: 30d
              valuemap:
                name: 'ZFS yes/no'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["scrub_active"]'
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: scrub
            - uuid: 7795c878683d4529a7a9c0efb3d4855f
              name: 'Pool {#POOL.NAME}: Last scrub repaired'
              type: DEPENDENT
              key: 'zfs.pool.scrub.repaired["{#POOL.NAME}"]'
              delay: '0'
              history: 90d
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["last_scrub_repaired"]'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: scrub
            - uuid: 970efb0b7ce749c0ae076b0e0b0a68ac
              name: 'Pool {#POOL.NAME}: Last scrub completion'
              type: DEPENDENT
              key: 'zfs.pool.scrub.epoch["{#POOL.NAME}"]'
              delay: '0'
              history: 90d
              units: unixtime
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["last_scrub_epoch"]'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: scrub
            - uuid: c41517f8b22149f5ba1810bd9e923f46
              name: 'Pool {#POOL.NAME}: Resilver active'
              type: DEPENDENT
              key: 'zfs.pool.resilver.active["{#POOL.NAME}"]'
              delay: '0'
              history: 30d
              valuemap:
                name: 'ZFS yes/no'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["resilver_active"]'
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: resilver
            - uuid: c32aa15a6c204ed68e3b2e6a77d20bef
              name: 'Pool {#POOL.NAME}: Read throughput'
              type: DEPENDENT
              key: 'zfs.pool.io.read["{#POOL.NAME}"]'
              delay: '0'
              history: 30d
              units: Bps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["read_bytes"]'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: io
            - uuid: ae383960d1104606987017c44d92e27e
              name: 'Pool {#POOL.NAME}: Write throughput'
              type: DEPENDENT
              key: 'zfs.pool.io.write["{#POOL.NAME}"]'
              delay: '0'
              history: 30d
              units: Bps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["write_bytes"]'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: io
            - uuid: c5450800e59648e6bb56cf71f154be1a
              name: 'Pool {#POOL.NAME}: Read operations'
              type: DEPENDENT
              key: 'zfs.pool.io.read_ops["{#POOL.NAME}"]'
              delay: '0'
              history: 30d
              units: ops
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["read_operations"]'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: io
            - uuid: af05f76fc20d41a786f5af5071297b42
              name: 'Pool {#POOL.NAME}: Write operations'
              type: DEPENDENT
              key: 'zfs.pool.io.write_ops["{#POOL.NAME}"]'
              delay: '0'
              history: 30d
              units: ops
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["pools"]["{#POOL.NAME}"]["write_operations"]'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: io
          master_item:
            key: zfs.metrics
          lld_macro_paths:
            - lld_macro: '{#POOL.NAME}'
              path: $.name
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.pools.*
        - uuid: dbbd080e21c746ff9c47393b3f3cd11f
          name: 'ZFS vdev discovery'
          type: DEPENDENT
          key: zfs.vdev.discovery
          delay: '0'
          lifetime: 7d
          item_prototypes:
            - uuid: 0ab5c8c59471469587a0fa9586c64b11
              name: 'Vdev {#VDEV.NAME}: State'
              type: DEPENDENT
              key: 'zfs.vdev.state["{#VDEV.ID}"]'
              delay: '0'
              history: 90d
              value_type: CHAR
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["vdevs"]["{#VDEV.ID}"]["state"]'
              master_item:
                key: zfs.metrics
              tags:
                - tag: component
                  value: vdev
                - tag: pool
                  value: '{#VDEV.POOL}'
            - uuid: c09038a1bec8437c8ae4561387c15bd6
              name: 'Vdev {#VDEV.NAME}: Online'
              type: DEPENDENT
              key: 'zfs.vdev.online["{#VDEV.ID}"]'
              delay: '0'
              history: 90d
              valuemap:
                name: 'ZFS yes/no'
              preprocessing:
