apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: manticore-ingress
  namespace: private-cloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: manticore
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: affine
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: affine-migration
      ports:
        - {protocol: TCP, port: 9308}
