apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meilisearch-ingress
  namespace: private-cloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: meilisearch
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stalwart
      ports:
        - {protocol: TCP, port: 7700}
