apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  namespace: private-cloud
  labels:
    app.kubernetes.io/name: meilisearch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: meilisearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meilisearch
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.53.1
          imagePullPolicy: IfNotPresent
          env:
            - {name: MEILI_ENV, value: production}
            - {name: MEILI_NO_ANALYTICS, value: "true"}
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: meilisearch-credentials
                  key: MEILI_MASTER_KEY
          ports:
            - {name: http, containerPort: 7700, protocol: TCP}
          resources:
            requests: {memory: 1Gi}
            limits: {memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /meili_data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: meilisearch-data
