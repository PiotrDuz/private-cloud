metadata:
  name: zabbix-server-data
  namespace: private-cloud
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Ti
  storageClassName: ""
  volumeName: zabbix-server-data
