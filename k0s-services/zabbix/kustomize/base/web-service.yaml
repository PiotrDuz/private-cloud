apiVersion: v1
kind: Service
metadata:
  name: zabbix-web
  namespace: private-cloud
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
