apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-server
  namespace: private-cloud
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zabbix
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zabbix
        app.kubernetes.io/component: server
    spec:
      securityContext:
        fsGroup: 1995
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: wait-for-postgres
          image: postgres:18.4-bookworm
          imagePullPolicy: IfNotPresent
          command:
            - pg_isready
          args:
            - -h
            - $(DB_SERVER_HOST)
            - -p
            - $(DB_SERVER_PORT)
            - -U
            - $(POSTGRES_USER)
          env:
            - name: DB_SERVER_HOST
              value: postgres
            - name: DB_SERVER_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: zabbix-postgres-credentials
                  key: POSTGRES_USER
      containers:
        - name: server
          image: zabbix/zabbix-server-pgsql:ubuntu-7.4.12
          imagePullPolicy: IfNotPresent
          ports:
            - name: zabbix-trapper
              containerPort: 10051
              protocol: TCP
          env:
            - name: DB_SERVER_HOST
              value: postgres
            - name: DB_SERVER_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: zabbix-postgres-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: zabbix-postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zabbix-postgres-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: server-data
              mountPath: /var/lib/zabbix
          readinessProbe:
            tcpSocket:
              port: zabbix-trapper
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: zabbix-trapper
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: server-data
          persistentVolumeClaim:
            claimName: zabbix-server-data
