apiVersion: v1
kind: PersistentVolume
metadata:
  name: onlyoffice-data
  labels:
    app.kubernetes.io/name: onlyoffice
spec:
  capacity:
    storage: 10Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: private-cloud
    name: onlyoffice-data
  local:
    path: /tank/secure/backup/k0s/services/onlyoffice
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - replace-with-k0s-node
