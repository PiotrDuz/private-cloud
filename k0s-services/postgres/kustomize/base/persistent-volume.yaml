apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-local-pv
  labels:
    app.kubernetes.io/name: postgres
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: private-cloud
    name: postgres-data
  local:
    path: /var/lib/private-cloud/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - private-cloud-node
