apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  namespace: private-cloud
  labels:
    app.kubernetes.io/name: stalwart
spec:
  serviceName: stalwart-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v0.16
          imagePullPolicy: IfNotPresent
          args: [--config, /etc/stalwart/config.json]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
            seccompProfile: {type: RuntimeDefault}
          env:
            - {name: STALWART_PUBLIC_URL, value: https://mail.example.com}
            - name: STALWART_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: stalwart-runtime-credentials, key: STALWART_DB_PASSWORD}}
            - name: INBOX_EU_SMTP_PASSWORD
              valueFrom: {secretKeyRef: {name: stalwart-runtime-credentials, key: INBOX_EU_SMTP_PASSWORD}}
            - name: MEILI_MASTER_KEY
              valueFrom: {secretKeyRef: {name: meilisearch-credentials, key: MEILI_MASTER_KEY}}
          ports:
            - {name: management, containerPort: 8080, protocol: TCP}
            - {name: https, containerPort: 443, protocol: TCP}
            - {name: smtp, containerPort: 25, protocol: TCP}
            - {name: submissions, containerPort: 465, protocol: TCP}
            - {name: submission, containerPort: 587, protocol: TCP}
            - {name: imaps, containerPort: 993, protocol: TCP}
          resources:
            requests: {memory: 2Gi}
            limits: {memory: 2Gi}
          readinessProbe:
            httpGet: {path: /healthz/ready, port: management}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /healthz/live, port: management}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - {name: config, mountPath: /etc/stalwart/config.json, subPath: config.json, readOnly: true}
            - {name: data, mountPath: /var/lib/stalwart}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: stalwart-config}
        - name: data
          persistentVolumeClaim: {claimName: stalwart-data}
        - name: temporary
          emptyDir: {}
