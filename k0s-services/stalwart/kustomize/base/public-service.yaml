apiVersion: v1
kind: Service
metadata:
  name: stalwart-public
  namespace: private-cloud
  labels:
    app.kubernetes.io/name: stalwart
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - {name: https, port: 443, targetPort: https, nodePort: 30443, protocol: TCP}
    - {name: smtp, port: 25, targetPort: smtp, nodePort: 30025, protocol: TCP}
    - {name: submissions, port: 465, targetPort: submissions, nodePort: 30465, protocol: TCP}
    - {name: submission, port: 587, targetPort: submission, nodePort: 30587, protocol: TCP}
    - {name: imaps, port: 993, targetPort: imaps, nodePort: 30993, protocol: TCP}
