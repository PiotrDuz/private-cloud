apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: affine-ingress
  namespace: private-cloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: affine
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 3010}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: affine-redis-ingress
  namespace: private-cloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: affine-redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: affine
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: affine-migration
      ports:
        - {protocol: TCP, port: 6379}
