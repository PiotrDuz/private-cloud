apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine-redis
  namespace: private-cloud
  labels: {app.kubernetes.io/name: affine-redis}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: affine-redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: affine-redis}
    spec:
      containers:
        - name: redis
          image: redis:8.2.1-alpine
          imagePullPolicy: IfNotPresent
          args: [redis-server, --save, "", --appendonly, "no"]
          ports:
            - {name: redis, containerPort: 6379, protocol: TCP}
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec: {command: [redis-cli, ping]}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
