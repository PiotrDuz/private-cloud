---
- name: Check the Stalwart OIDC provider and its registered clients
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/validation/check_identity.py"
    stdin: >-
      {{ {
        'address': private_cloud.networking.traefik_internal_ip,
        'hostname': private_cloud.stalwart.hostname,
        'username': private_cloud.stalwart.admin_username,
        'password': private_cloud_secrets.stalwart.admin_password,
        'clients': [
          {'stage': 'opencloud', 'id': 'web', 'redirects': ['https://' ~ private_cloud.opencloud.hostname ~ '/', 'https://' ~ private_cloud.opencloud.hostname ~ '/oidc-callback.html', 'https://' ~ private_cloud.opencloud.hostname ~ '/oidc-silent-redirect.html']},
          {'stage': 'opencloud', 'id': 'OpenCloudDesktop', 'redirects': ['http://127.0.0.1', 'http://localhost']},
          {'stage': 'opencloud', 'id': 'OpenCloudAndroid', 'redirects': ['oc://android.opencloud.eu']},
          {'stage': 'opencloud', 'id': 'OpenCloudIOS', 'redirects': ['oc://ios.opencloud.eu']},
          {'stage': 'grist', 'id': 'grist-forward-auth', 'redirects': ['https://' ~ private_cloud.grist.hostname ~ '/oauth2/callback']},
          {'stage': 'affine', 'id': 'affine', 'redirects': ['https://' ~ private_cloud.affine.hostname ~ '/oauth/callback']},
          {'stage': 'immich', 'id': 'immich', 'redirects': ['https://' ~ private_cloud.immich.hostname ~ '/auth/login', 'https://' ~ private_cloud.immich.hostname ~ '/user-settings', 'https://' ~ private_cloud.immich.hostname ~ '/api/oauth/mobile-redirect']}
        ] | selectattr('stage', 'in', private_cloud.stages | dict2items | selectattr('value', 'equalto', true) | map(attribute='key') | list) | list,
        'forward_auth': {
          'hostname': private_cloud.grist.hostname,
          'client_id': 'grist-forward-auth',
          'redirect': 'https://' ~ private_cloud.grist.hostname ~ '/oauth2/callback'
        } if private_cloud.stages.grist | bool else {}
      } | to_json }}
  register: identity_check
  until: identity_check.rc == 0
  retries: 18
  delay: 10
  changed_when: false
  failed_when: false
  when: private_cloud.stages.stalwart | bool
  no_log: true

- name: Require the Stalwart OIDC provider and clients to be correct
  ansible.builtin.assert:
    that: identity_check.rc | default(0) == 0
    fail_msg: "{{ identity_check.stderr | default('') }}"
  when: private_cloud.stages.stalwart | bool
