---
# Commit Zabbix host endpoint changes here.
private_cloud_zabbix_hostname: private-cloud-zabbix
private_cloud_zabbix_psk_identity: private-cloud-zabbix-agent
private_cloud_zabbix_agent_server_active: 127.0.0.1:31051
private_cloud_alert_smtp_host: stalwart.private-cloud.svc.cluster.local
private_cloud_alert_smtp_port: 2525
# LAN DNS forwards uncached public lookups to these resolvers over DNS-over-TLS.
private_cloud_lan_dns_upstreams: [1.1.1.1, 1.0.0.1]
private_cloud_lan_dns_upstream_tls_name: cloudflare-dns.com

# Memory requests reserved per container; preflight budgets these and limits stay burstable.
private_cloud_memory_requests:
  traefik: 96Mi
  amneziawg: 96Mi
  ddns: 32Mi
  lan_dns: 32Mi
  forward_auth: 32Mi
  homepage: 16Mi
  postgres: 384Mi
  meilisearch: 64Mi
  tika: 256Mi
  onlyoffice: 1Gi
  opencloud: 256Mi
  grist: 320Mi
  manticore: 384Mi
  redis_affine: 32Mi
  affine: 256Mi
  affine_preparation: 512Mi
  immich: 768Mi
  immich_machine_learning: 384Mi
  valkey_immich: 32Mi
  stalwart: 96Mi
  imap_fetch: 32Mi
  zabbix_server: 160Mi
  zabbix_web: 64Mi
  openobserve: 256Mi
  alloy: 384Mi
  jellyfin: 320Mi
  sonarr: 192Mi
  radarr: 192Mi
  prowlarr: 192Mi
  qbittorrent: 64Mi
  vpn_gateway: 64Mi
  dns: 32Mi
  vpn_route: 16Mi
  file_logs: 16Mi

# Allowed monitored dataset paths; preflight and the ZFS collector both enforce them.
private_cloud_allowed_datasets:
  exact:
    - tank/secure/backup/private-cloud-config
  prefixes:
    - tank/secure/backup/k0s/
    - tank/secure/no-backup/k0s/

private_cloud_dataset_catalog:
  - {name: installer-config, stage: zfs, dataset: tank/secure/backup/private-cloud-config, color: 42A5F5}
  - {name: openobserve, stage: logging, dataset: tank/secure/no-backup/k0s/services/openobserve, color: FFA726}
  - {name: alloy, stage: logging, dataset: tank/secure/no-backup/k0s/services/alloy, color: 26A69A}
  - {name: config, stage: k0s, dataset: tank/secure/backup/k0s/config, color: 42A5F5}
  - {name: images, stage: k0s, dataset: tank/secure/no-backup/k0s/images, color: 66BB6A}
  - {name: ephemeral, stage: k0s, dataset: tank/secure/no-backup/k0s/ephemeral, color: FFA726}
  - {name: traefik, stage: networking, dataset: tank/secure/backup/k0s/services/traefik, color: 26A69A}
  - {name: amneziawg, stage: networking, dataset: tank/secure/backup/k0s/services/amneziawg, color: 5C6BC0}
  - {name: jellyfin, stage: media, dataset: tank/secure/backup/k0s/services/jellyfin, color: 00897B}
  - {name: sonarr, stage: media, dataset: tank/secure/no-backup/k0s/services/sonarr, color: 42A5F5}
  - {name: radarr, stage: media, dataset: tank/secure/no-backup/k0s/services/radarr, color: FFC107}
  - {name: prowlarr, stage: media, dataset: tank/secure/no-backup/k0s/services/prowlarr, color: 7E57C2}
  - {name: qbittorrent, stage: media, dataset: tank/secure/no-backup/k0s/services/qbittorrent, color: 2196F3}
  - {name: media-library, stage: media, dataset: tank/secure/no-backup/k0s/services/media-library, color: 66BB6A}
  - {name: postgres, stage: postgres, dataset: tank/secure/backup/k0s/services/postgres, color: AB47BC}
  - {name: meilisearch, stage: meilisearch, dataset: tank/secure/backup/k0s/services/meilisearch, color: 26A69A}
  - {name: tika, stage: tika, dataset: tank/secure/backup/k0s/services/tika, color: 8D6E63}
  - {name: bleve, stage: bleve, dataset: tank/secure/backup/k0s/services/bleve, color: 26C6DA}
  - {name: onlyoffice, stage: onlyoffice, dataset: tank/secure/backup/k0s/services/onlyoffice, color: D4E157}
  - {name: opencloud, stage: opencloud, dataset: tank/secure/backup/k0s/services/opencloud, color: EC407A}
  - {name: grist, stage: grist, dataset: tank/secure/backup/k0s/services/grist, color: 7E57C2}
  - {name: manticore, stage: manticore, dataset: tank/secure/backup/k0s/services/manticore, color: FF7043}
  - {name: affine, stage: affine, dataset: tank/secure/backup/k0s/services/affine, color: 29B6F6}
  - {name: immich, stage: immich, dataset: tank/secure/backup/k0s/services/immich, color: 7CB342}
  - {name: stalwart, stage: stalwart, dataset: tank/secure/backup/k0s/services/stalwart, color: 5C6BC0}
  - {name: zabbix, stage: zabbix_server, dataset: tank/secure/backup/k0s/services/zabbix, color: EF5350}

# k0s and networking require each other; networking owns the default-deny baseline.
private_cloud_stage_dependencies:
  boot_integrity: []
  k0s: [zfs, networking]
  networking: [k0s]
  media: [networking]
  intel_gpu: [k0s]
  postgres: [k0s]
  meilisearch: [k0s]
  stalwart: [networking, postgres, meilisearch]
  tika: [k0s]
  bleve: [k0s]
  onlyoffice: [networking]
  opencloud: [tika, bleve, onlyoffice, networking, stalwart]
  grist: [networking, postgres, stalwart]
  manticore: [k0s]
  redis_affine: [k0s]
  affine: [networking, postgres, manticore, redis_affine, stalwart]
  immich: [networking, postgres, stalwart]
  zabbix_server: [networking, postgres]
  logging: [networking]
  notifications: [logging, stalwart, zabbix_server, zabbix_agent]
  zabbix_agent: [zabbix_server]
