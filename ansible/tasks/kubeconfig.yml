---
- name: Ensure the installer runtime directory exists
  ansible.builtin.file:
    path: "{{ private_cloud_kubeconfig | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Inspect the k0s kubeconfig
  ansible.builtin.stat:
    path: "{{ private_cloud_kubeconfig }}"
  register: private_cloud_kubeconfig_stat

- name: Generate a missing k0s kubeconfig
  ansible.builtin.command: k0s kubeconfig admin
  register: private_cloud_generated_kubeconfig
  when: not private_cloud_kubeconfig_stat.stat.exists
  changed_when: true
  no_log: true

- name: Install the generated kubeconfig
  ansible.builtin.copy:
    content: "{{ private_cloud_generated_kubeconfig.stdout }}"
    dest: "{{ private_cloud_kubeconfig }}"
    owner: root
    group: root
    mode: '0600'
  when: not private_cloud_kubeconfig_stat.stat.exists
  no_log: true

- name: Refresh kubeconfig metadata
  ansible.builtin.stat:
    path: "{{ private_cloud_kubeconfig }}"
  register: private_cloud_kubeconfig_stat

- name: Require the root-only k0s kubeconfig
  ansible.builtin.assert:
    that:
      - private_cloud_kubeconfig_stat.stat.exists
      - private_cloud_kubeconfig_stat.stat.mode == '0600'
      - private_cloud_kubeconfig_stat.stat.uid | int == 0
    fail_msg: The k0s kubeconfig must exist as a root-owned 0600 file.
