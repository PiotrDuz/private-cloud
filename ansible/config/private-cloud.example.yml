schema_version: 4
private_cloud:
  stages:
    zfs: true
    k0s: true
    intel_gpu: true
    postgres: true
    meilisearch: true
    stalwart: true
    tika: true
    bleve: true
    onlyoffice: true
    opencloud: true
    grist: true
    manticore: true
    redis_affine: true
    affine: true
    immich: true
    zabbix_server: true
    zabbix_agent: true
  storage:
    disks:
      - /dev/disk/by-id/replace-with-first-disk
      - /dev/disk/by-id/replace-with-second-disk
  k0s:
    config_quota: 1G
    images_quota: 10G
    ephemeral_quota: 10G
  postgres:
    volume_size: 20G
    max_ram: 2Gi
  meilisearch:
    storage_size: 20G
    max_ram: 1Gi
  tika:
    storage_size: 5G
    max_ram: 1Gi
  bleve:
    storage_size: 20G
  onlyoffice:
    storage_size: 20G
    max_ram: 4Gi
    hostname: onlyoffice.example.com
  opencloud:
    storage_size: 100G
    max_ram: 4Gi
    hostname: cloud.example.com
  grist:
    storage_size: 50G
    max_ram: 2Gi
    default_email: admin@example.com
    hostname: grist.example.com
  manticore:
    storage_size: 50G
    max_ram: 1Gi
  redis_affine:
    max_ram: 512Mi
  affine:
    storage_size: 100G
    max_ram: 4Gi
    hostname: affine.example.com
  immich:
    storage_size: 100G
    hostname: photos.example.com
    timezone: Etc/UTC
    max_ram: 4Gi
    max_cpu: "4"
    machine_learning_max_ram: 4Gi
    machine_learning_max_cpu: "4"
    machine_learning_accelerator: openvino
    valkey_max_ram: 512Mi
    valkey_max_cpu: "1"
  stalwart:
    storage_size: 100G
    max_ram: 2Gi
    domain: example.com
    forwarding_domain: inbound.example.com
    hostname: mail.example.com
    acme_contact: postmaster@example.com
    admin_username: admin
    mailbox_username: user
    relay_host: mail.inbox.eu
    relay_port: 465
    relay_implicit_tls: true
    relay_username: user@example.com
  zabbix:
    storage_size: 5G
    admin_username: Admin
