schema_version: 18
private_cloud:
  domain: example.com
  admin_email: admin@example.com
  timezone: Etc/UTC
  stages:
    zfs: true
    boot_integrity: false
    k0s: true
    networking: true
    media: true
    intel_gpu: true
    postgres: true
    meilisearch: true
    stalwart: true
    tika: true
    bleve: true
    onlyoffice: true
    opencloud: true
    grist: true
    manticore: true
    redis_affine: true
    affine: true
    immich: true
    logging: true
    notifications: true
    zabbix_server: true
    zabbix_agent: true
  storage:
    arc_max: 1536Mi
    disks:
      - /dev/disk/by-id/replace-with-first-disk
      - /dev/disk/by-id/replace-with-second-disk
  k0s:
    host_reserve_ram: 3584Mi
    config_quota: 1G
    images_quota: 10G
    ephemeral_quota: 10G
  networking:
    storage_size: 1G
    cloudflare_zone_id: '00000000000000000000000000000000'
    public_ip_url: https://api.ipify.org
    pod_cidr: 10.244.0.0/16
    service_cidr: 10.96.0.0/12
    cluster_dns_ip: 10.96.0.10
    lan:
      interface: enp1s0
      address: 192.168.1.10/24
      gateway: 192.168.1.1
    local_network_cidrs:
      - 192.168.1.0/24
    amneziawg:
      admin_username: vpn-admin
      storage_size: 1G
      tunnel_cidr: 10.90.0.0/24
      listen_port: 51820
      lan_access:
        - destination: 192.168.1.20/32
          protocol: TCP
          port: 443
  media:
    max_ram:
      sonarr: 1Gi
      radarr: 1Gi
      prowlarr: 1Gi
      qbittorrent: 1Gi
      jellyfin: 4Gi
      vpn_gateway: 512Mi
      vpn_route: 64Mi
      dns: 128Mi
      file_logs: 64Mi
    storage_size: 1T
    jellyfin_admin_username: admin
    quality_profiles:
      sonarr: 1080p
      radarr: 1080p
    vpn:
      gateway_cluster_ip: 10.96.0.53
      server_countries:
        - Switzerland
      endpoint_port: 1637
      # AirVPN forwards this public port through the tunnel to qBittorrent, so other peers can open connections to it.
      forwarded_port: 40000 # replace with the port created in AirVPN Client Area, Ports, for TCP and UDP
      peer_public_key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= # replace with the AirVPN [Peer] PublicKey
      address: 10.128.64.2/32 # replace with your AirVPN [Interface] Address IPv4 value
      mtu: 1320
      dns: 10.128.0.1
      persistent_keepalive: 15
  postgres:
    volume_size: 20G
    max_ram: 2Gi
  meilisearch:
    storage_size: 20G
    max_ram: 1Gi
  tika:
    storage_size: 5G
    max_ram: 1Gi
  bleve:
    storage_size: 20G
  onlyoffice:
    storage_size: 20G
    max_ram: 4Gi
  opencloud:
    storage_size: 100G
    max_ram: 1Gi
  grist:
    storage_size: 50G
    max_ram: 2Gi
  manticore:
    storage_size: 50G
    max_ram: 1Gi
  redis_affine:
    max_ram: 256Mi
  affine:
    storage_size: 100G
    max_ram: 2Gi
  immich:
    storage_size: 100G
    max_ram: 2Gi
    machine_learning_max_ram: 4Gi
    machine_learning_accelerator: openvino
    valkey_max_ram: 256Mi
  stalwart:
    storage_size: 100G
    max_ram: 1Gi
    admin_username: admin
    mailbox_username: user
    relay_host: mail.inbox.eu
    relay_port: 465
    relay_implicit_tls: true
    relay_username: user@example.com
  zabbix:
    storage_size: 5G
    admin_username: Admin
  logging:
    openobserve_storage_size: 50G
    alloy_storage_size: 5G
    openobserve_max_ram: 2Gi
    alloy_max_ram: 1Gi
    retention_days: 14
  notifications:
    from_address: user@example.com
  boot_integrity:
    extra_pcrs: []
    extra_drivers: []
