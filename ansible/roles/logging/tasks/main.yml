---
- name: Prepare logging kubeconfig
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/kubeconfig.yml"
  vars:
    private_cloud_kubeconfig: "{{ logging_kubeconfig }}"

- name: Prepare each logging dataset
  ansible.builtin.include_tasks: dataset.yml
  loop: "{{ logging_services }}"
  loop_control:
    loop_var: logging_service

- name: Configure host log retention and heartbeat
  ansible.builtin.import_tasks: host.yml

- name: Apply OpenObserve credentials
  kubernetes.core.k8s:
    kubeconfig: "{{ logging_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', 'secret.yml.j2') | from_yaml }}"
  register: logging_secret_apply
  no_log: true

- name: Apply OpenObserve
  ansible.builtin.include_tasks: deploy.yml
  vars:
    logging_component: openobserve

- name: Restart OpenObserve after credential changes
  kubernetes.core.k8s:
    kubeconfig: "{{ logging_kubeconfig }}"
    state: patched
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: openobserve, namespace: observability}
      spec:
        template:
          metadata:
            annotations:
              private-cloud.example/credentials-restarted-at: "{{ ansible_date_time.iso8601 }}"
  when: logging_secret_apply.changed
  no_log: true

- name: Wait for OpenObserve
  kubernetes.core.k8s_info:
    kubeconfig: "{{ logging_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    name: openobserve
    namespace: observability
  register: logging_openobserve_workload
  until:
    - logging_openobserve_workload.resources | length == 1
    - logging_openobserve_workload.resources[0].status.observedGeneration | default(0) | int >= logging_openobserve_workload.resources[0].metadata.generation | int
    - logging_openobserve_workload.resources[0].status.updatedReplicas | default(0) | int == 1
    - logging_openobserve_workload.resources[0].status.availableReplicas | default(0) | int == 1
  retries: 60
  delay: 5
  changed_when: false

- name: Resolve the OpenObserve endpoint
  kubernetes.core.k8s_info:
    kubeconfig: "{{ logging_kubeconfig }}"
    api_version: v1
    kind: Service
    name: openobserve
    namespace: observability
  register: logging_openobserve_endpoint
  changed_when: false

- name: Read the OpenObserve ingestion token
  ansible.builtin.uri:
    url: 'http://{{ logging_openobserve_endpoint.resources[0].spec.clusterIP }}:5080/api/default/passcode'
    url_username: "{{ private_cloud.stalwart.mailbox_username ~ '@' ~ private_cloud.stalwart.forwarding_domain }}"
    url_password: "{{ private_cloud_secrets.logging.admin_password }}"
    force_basic_auth: true
    return_content: true
  register: logging_ingestion_token
  no_log: true

- name: Apply the OpenObserve ingestion token
  kubernetes.core.k8s:
    kubeconfig: "{{ logging_kubeconfig }}"
    state: patched
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: openobserve-ingest, namespace: observability}
      stringData:
        ingest-password: "{{ logging_ingestion_token.json.data.passcode }}"
  register: logging_ingestion_secret_apply
  no_log: true

- name: Apply Alloy
  ansible.builtin.include_tasks: deploy.yml
  vars:
    logging_component: alloy

- name: Restart Alloy after ingestion credential changes
  kubernetes.core.k8s:
    kubeconfig: "{{ logging_kubeconfig }}"
    state: patched
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: alloy, namespace: observability}
      spec:
        template:
          metadata:
            annotations:
              private-cloud.example/credentials-restarted-at: "{{ ansible_date_time.iso8601 }}"
  when: logging_ingestion_secret_apply.changed
  no_log: true

- name: Wait for Alloy
  kubernetes.core.k8s_info:
    kubeconfig: "{{ logging_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    name: alloy
    namespace: observability
  register: logging_alloy_workload
  until:
    - logging_alloy_workload.resources | length == 1
    - logging_alloy_workload.resources[0].status.observedGeneration | default(0) | int >= logging_alloy_workload.resources[0].metadata.generation | int
    - logging_alloy_workload.resources[0].status.updatedReplicas | default(0) | int == 1
    - logging_alloy_workload.resources[0].status.availableReplicas | default(0) | int == 1
  retries: 60
  delay: 5
  changed_when: false

- name: Resolve logging service endpoints
  kubernetes.core.k8s_info:
    kubeconfig: "{{ logging_kubeconfig }}"
    api_version: v1
    kind: Service
    name: "{{ item.name }}"
    namespace: observability
  loop: "{{ logging_services }}"
  register: logging_endpoints
  changed_when: false

- name: Provision OpenObserve log alerts
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../logging/provision_openobserve.py"
    stdin: >-
      {{ {
        'endpoint': 'http://' ~ logging_endpoints.results[0].resources[0].spec.clusterIP ~ ':5080',
        'username': private_cloud.stalwart.mailbox_username ~ '@' ~ private_cloud.stalwart.forwarding_domain,
        'password': private_cloud_secrets.logging.admin_password,
        'recipient': private_cloud.stalwart.mailbox_username ~ '@' ~ private_cloud.stalwart.forwarding_domain,
        'notifications': private_cloud.stages.notifications
      } | to_json }}
  register: logging_openobserve_provision
  changed_when: (logging_openobserve_provision.stdout | from_json).changed
  no_log: true
