---
- name: Verify exact k0s mount-unit dependencies
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/storage_checks.py"
      - k0s-mounts
      - --service
      - "{{ k0s_controller_service }}"
      - --mountpoints
      - "{{ k0s_config_mountpoint }}"
      - "{{ k0s_images_mountpoint }}"
      - "{{ k0s_ephemeral_mountpoint }}"
  changed_when: false

- name: Wait for a Ready k0s node
  ansible.builtin.command: "{{ k0s_binary_path }} kubectl get nodes --no-headers"
  register: k0s_node_status
  changed_when: false
  retries: 30
  delay: 10
  until: k0s_node_status.rc == 0 and ' Ready ' in (' ' ~ k0s_node_status.stdout ~ ' ')

- name: Read the AppArmor unconfined change-profile restriction
  ansible.builtin.slurp:
    src: /proc/sys/kernel/apparmor_restrict_unprivileged_unconfined
  register: k0s_validation_apparmor_restriction
  failed_when: false

- name: Require unstacked container AppArmor profiles
  ansible.builtin.assert:
    that: k0s_validation_apparmor_restriction.content | b64decode | trim == '0'
    fail_msg: Stacked container AppArmor profiles deny signals between container processes.
  when: k0s_validation_apparmor_restriction.content is defined

- name: Verify every k0s runtime mountpoint
  ansible.builtin.command: mountpoint -q {{ item }}
  loop:
    - "{{ k0s_config_mountpoint }}"
    - "{{ k0s_images_mountpoint }}"
    - "{{ k0s_ephemeral_mountpoint }}"
  changed_when: false

- name: Read the active kubelet forwarding allowlist
  ansible.builtin.slurp:
    src: /run/k0s/kubelet/config.yaml
  register: k0s_validation_worker_configuration
  when: private_cloud.stages.networking | bool

- name: Require the narrowly configured namespaced VPN forwarding setting
  ansible.builtin.assert:
    that: (k0s_validation_worker_configuration.content | b64decode | from_yaml).allowedUnsafeSysctls | default([]) == ['net.ipv4.ip_forward']
    fail_msg: The active kubelet has not loaded the VPN forwarding allowlist.
  when: private_cloud.stages.networking | bool

- name: Require the per-pod process limit
  ansible.builtin.assert:
    that: (k0s_validation_worker_configuration.content | b64decode | from_yaml).podPidsLimit | default(0) == k0s_pod_pids_limit
    fail_msg: The active kubelet does not limit processes per pod.
  when: private_cloud.stages.networking | bool

- name: Require cluster DNS to forward to the LAN DNS Service
  ansible.builtin.assert:
    that:
      - (k0s_validation_worker_configuration.content | b64decode | from_yaml).resolvConf | default('') == k0s_kubelet_resolv_conf
      - lookup('ansible.builtin.file', k0s_kubelet_resolv_conf) | trim == 'nameserver ' ~ private_cloud.networking.lan_dns_cluster_ip
    fail_msg: The active kubelet does not point cluster DNS at the LAN DNS Service.
  when: private_cloud.stages.networking | bool

- name: Read the Pod Security Admission labels of the managed namespaces
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k0s_kubeconfig_path }}"
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
  loop: [ "{{ k0s_namespace }}", media, edge, network-access, dns-system, observability ]
  register: k0s_validation_namespaces

- name: Require baseline auditing on every managed namespace
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.resources[0].metadata.labels['pod-security.kubernetes.io/enforce'] | default('') == 'privileged'
      - item.resources[0].metadata.labels['pod-security.kubernetes.io/enforce-version'] | default('') == k0s_pod_security_version
      - item.resources[0].metadata.labels['pod-security.kubernetes.io/audit'] | default('') == 'baseline'
      - item.resources[0].metadata.labels['pod-security.kubernetes.io/audit-version'] | default('') == k0s_pod_security_version
      - "'pod-security.kubernetes.io/warn' not in item.resources[0].metadata.labels"
    fail_msg: Namespace {{ item.item }} does not carry the Pod Security Admission labels.
  loop: "{{ k0s_validation_namespaces.results }}"
  loop_control: {label: "{{ item.item }}"}
