---
- name: Validate OnlyOffice inputs
  ansible.builtin.assert:
    that:
      - private_cloud.onlyoffice.storage_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.onlyoffice.max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
      - (private_cloud.onlyoffice.max_ram | human_to_bytes | int) >= 4294967296
      - private_cloud.onlyoffice.hostname is match('^(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$')
      - private_cloud.onlyoffice.node_port is integer
      - private_cloud.onlyoffice.node_port >= 30000
      - private_cloud.onlyoffice.node_port <= 32767
      - private_cloud_secrets.onlyoffice.jwt_secret | length >= 32
    fail_msg: OnlyOffice configuration is invalid.
  no_log: true

- name: Ensure the installer runtime directory exists
  ansible.builtin.file:
    path: "{{ onlyoffice_kubeconfig | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Inspect the k0s kubeconfig
  ansible.builtin.stat:
    path: "{{ onlyoffice_kubeconfig }}"
  register: onlyoffice_kubeconfig_stat

- name: Generate a missing k0s kubeconfig for tagged OnlyOffice reruns
  ansible.builtin.command: k0s kubeconfig admin
  register: onlyoffice_generated_kubeconfig
  when: not onlyoffice_kubeconfig_stat.stat.exists
  changed_when: true
  no_log: true

- name: Install the generated OnlyOffice kubeconfig
  ansible.builtin.copy:
    content: "{{ onlyoffice_generated_kubeconfig.stdout }}"
    dest: "{{ onlyoffice_kubeconfig }}"
    owner: root
    group: root
    mode: '0600'
  when: not onlyoffice_kubeconfig_stat.stat.exists
  no_log: true

- name: Resolve a Ready Kubernetes node
  kubernetes.core.k8s_info:
    kubeconfig: "{{ onlyoffice_kubeconfig }}"
    api_version: v1
    kind: Node
  register: onlyoffice_nodes
  changed_when: false

- name: Initialize OnlyOffice node selection
  ansible.builtin.set_fact:
    onlyoffice_node_name: ''

- name: Select the Ready Kubernetes node
  ansible.builtin.set_fact:
    onlyoffice_node_name: "{{ item.metadata.name }}"
  loop: "{{ onlyoffice_nodes.resources }}"
  when:
    - item.status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0
    - onlyoffice_node_name | length == 0

- name: Require a Ready Kubernetes node
  ansible.builtin.assert:
    that: onlyoffice_node_name | length > 0
    fail_msg: No Ready Kubernetes node is available for OnlyOffice.

- name: Check OnlyOffice service dataset
  ansible.builtin.command: zfs list -H -p -o name {{ onlyoffice_dataset }}
  register: onlyoffice_dataset_check
  changed_when: false
  failed_when: false

- name: Read OnlyOffice dataset usage
  ansible.builtin.command: zfs get -H -p -o value used {{ onlyoffice_dataset }}
  register: onlyoffice_dataset_used
  changed_when: false
  when: onlyoffice_dataset_check.rc == 0

- name: Reject an OnlyOffice quota below existing usage
  ansible.builtin.assert:
    that: (private_cloud.onlyoffice.storage_size | human_to_bytes) | int >= (onlyoffice_dataset_used.stdout | int)
    fail_msg: OnlyOffice storage_size cannot be smaller than existing dataset usage.
  when: onlyoffice_dataset_check.rc == 0

- name: Create OnlyOffice service dataset
  ansible.builtin.command: zfs create {{ onlyoffice_dataset }}
  when: onlyoffice_dataset_check.rc != 0
  changed_when: true

- name: Read OnlyOffice dataset quota
  ansible.builtin.command: zfs get -H -p -o value quota {{ onlyoffice_dataset }}
  register: onlyoffice_current_quota
  changed_when: false

- name: Apply OnlyOffice dataset quota
  ansible.builtin.command: zfs set quota={{ private_cloud.onlyoffice.storage_size }} {{ onlyoffice_dataset }}
  when: onlyoffice_current_quota.stdout | int != (private_cloud.onlyoffice.storage_size | human_to_bytes | int)
  changed_when: true

- name: Verify OnlyOffice dataset is mounted
  ansible.builtin.command: mountpoint -q {{ onlyoffice_dataset_mountpoint }}
  changed_when: false

- name: Verify OnlyOffice dataset quota
  ansible.builtin.command: zfs get -H -p -o value quota {{ onlyoffice_dataset }}
  register: onlyoffice_effective_quota
  changed_when: false

- name: Assert OnlyOffice dataset quota
  ansible.builtin.assert:
    that: onlyoffice_effective_quota.stdout | int == (private_cloud.onlyoffice.storage_size | human_to_bytes | int)
    fail_msg: OnlyOffice dataset quota does not match storage_size.

- name: Inspect existing OnlyOffice storage and credentials
  kubernetes.core.k8s_info:
    kubeconfig: "{{ onlyoffice_kubeconfig }}"
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ item.namespace | default(omit) }}"
  loop:
    - {api_version: v1, kind: PersistentVolume, name: onlyoffice-data}
    - {api_version: v1, kind: PersistentVolumeClaim, name: onlyoffice-data, namespace: private-cloud}
    - {api_version: v1, kind: Secret, name: onlyoffice-credentials, namespace: private-cloud}
  register: onlyoffice_existing
  changed_when: false
  no_log: true

- name: Reject incompatible OnlyOffice persistent storage
  ansible.builtin.assert:
    that:
      - onlyoffice_existing.results[0].resources | length == 0 or onlyoffice_existing.results[0].resources[0].spec.local.path == onlyoffice_dataset_mountpoint
      - onlyoffice_existing.results[0].resources | length == 0 or onlyoffice_existing.results[0].resources[0].spec.capacity.storage == onlyoffice_pv_capacity
      - onlyoffice_existing.results[0].resources | length == 0 or onlyoffice_node_name in onlyoffice_existing.results[0].resources[0].spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values
      - onlyoffice_existing.results[1].resources | length == 0 or onlyoffice_existing.results[1].resources[0].spec.resources.requests.storage == onlyoffice_pv_capacity
      - onlyoffice_existing.results[1].resources | length == 0 or onlyoffice_existing.results[1].resources[0].spec.volumeName == onlyoffice_pv_name
    fail_msg: Existing OnlyOffice persistent storage conflicts with the configured local storage.

- name: Classify the existing OnlyOffice credentials
  ansible.builtin.set_fact:
    onlyoffice_secret_present: "{{ onlyoffice_existing.results[2].resources | length > 0 }}"
    onlyoffice_secret_managed: >-
      {{ onlyoffice_existing.results[2].resources | length > 0 and
         ((onlyoffice_existing.results[2].resources[0].metadata.annotations | default({})).get('private-cloud.example/managed-by', '') == 'ansible') }}
    onlyoffice_secret_matches: >-
      {{ onlyoffice_existing.results[2].resources | length > 0 and
         onlyoffice_existing.results[2].resources[0].data.JWT_SECRET is defined and
         (onlyoffice_existing.results[2].resources[0].data.JWT_SECRET | b64decode == private_cloud_secrets.onlyoffice.jwt_secret) }}
  no_log: true

- name: Reject incompatible unmanaged OnlyOffice credentials
  ansible.builtin.assert:
    that: not onlyoffice_secret_present | bool or onlyoffice_secret_matches | bool or onlyoffice_secret_managed | bool
    fail_msg: Existing OnlyOffice credentials conflict with the configured JWT secret.
  no_log: true

- name: Apply OnlyOffice credentials
  kubernetes.core.k8s:
    kubeconfig: "{{ onlyoffice_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', 'secret.yml.j2') | from_yaml }}"
  register: onlyoffice_secret_apply
  when: not onlyoffice_secret_present | bool or not onlyoffice_secret_matches | bool
  no_log: true

- name: Apply OnlyOffice storage and workload
  kubernetes.core.k8s:
    kubeconfig: "{{ onlyoffice_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', item) | from_yaml }}"
  loop:
    - pv.yml.j2
    - pvc.yml.j2
    - deployment.yml.j2
    - service.yml.j2
    - public-service.yml.j2
  no_log: true

- name: Restart OnlyOffice after a credentials change
  kubernetes.core.k8s:
    kubeconfig: "{{ onlyoffice_kubeconfig }}"
    state: patched
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ onlyoffice_service_name }}"
        namespace: "{{ onlyoffice_namespace }}"
      spec:
        template:
          metadata:
            annotations:
              private-cloud.example/credentials-restarted-at: "{{ ansible_date_time.iso8601 }}"
  when: onlyoffice_secret_apply.changed | default(false)
  no_log: true

- name: Wait for OnlyOffice deployment
  kubernetes.core.k8s_info:
    kubeconfig: "{{ onlyoffice_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    name: "{{ onlyoffice_service_name }}"
    namespace: "{{ onlyoffice_namespace }}"
  register: onlyoffice_deployment
  until:
    - onlyoffice_deployment.resources | length > 0
    - onlyoffice_deployment.resources[0].status.updatedReplicas | default(0) | int == 1
    - onlyoffice_deployment.resources[0].status.availableReplicas | default(0) | int == 1
  retries: 90
  delay: 5
  changed_when: false

- name: Wait for OnlyOffice service endpoint
  kubernetes.core.k8s_info:
    kubeconfig: "{{ onlyoffice_kubeconfig }}"
    api_version: v1
    kind: Endpoints
    name: "{{ onlyoffice_service_name }}"
    namespace: "{{ onlyoffice_namespace }}"
  register: onlyoffice_endpoint
  until: onlyoffice_endpoint.resources | length > 0 and (onlyoffice_endpoint.resources[0].subsets | default([]) | selectattr('addresses', 'defined') | list | length > 0)
  retries: 90
  delay: 5
  changed_when: false
