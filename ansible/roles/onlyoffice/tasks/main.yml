---
- name: Validate OnlyOffice inputs
  ansible.builtin.assert:
    that:
      - private_cloud.onlyoffice.storage_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.onlyoffice.max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
      - (private_cloud.onlyoffice.max_ram | human_to_bytes | int) >= 4294967296
      - private_cloud.onlyoffice.hostname is match('^(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$')
      - private_cloud.onlyoffice.node_port is integer
      - private_cloud.onlyoffice.node_port >= 30000
      - private_cloud.onlyoffice.node_port <= 32767
      - private_cloud_secrets.onlyoffice.jwt_secret | length >= 32
    fail_msg: OnlyOffice configuration is invalid.
  no_log: true

- name: Prepare the OnlyOffice kubeconfig
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/kubeconfig.yml"
  vars:
    private_cloud_kubeconfig: "{{ onlyoffice_kubeconfig }}"

- name: Resolve a Ready Kubernetes node
  kubernetes.core.k8s_info:
    kubeconfig: "{{ onlyoffice_kubeconfig }}"
    api_version: v1
    kind: Node
    name: "{{ ansible_hostname }}"
  register: onlyoffice_nodes
  changed_when: false

- name: Select the managed storage node
  ansible.builtin.set_fact:
    onlyoffice_node_name: "{{ ansible_hostname }}"

- name: Require the managed storage node to be Ready
  ansible.builtin.assert:
    that:
      - onlyoffice_nodes.resources | length == 1
      - onlyoffice_nodes.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0
    fail_msg: "Managed storage host {{ ansible_hostname }} is not a Ready Kubernetes node for OnlyOffice."

- name: Prepare the OnlyOffice service dataset
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/service_dataset.yml"
  vars:
    private_cloud_service_name: OnlyOffice
    private_cloud_service_dataset: "{{ onlyoffice_dataset }}"
    private_cloud_service_dataset_mountpoint: "{{ onlyoffice_dataset_mountpoint }}"
    private_cloud_service_storage_size: "{{ private_cloud.onlyoffice.storage_size }}"

- name: Verify the OnlyOffice service dataset quota
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/service_dataset_quota.yml"
  vars:
    private_cloud_service_name: OnlyOffice
    private_cloud_service_dataset: "{{ onlyoffice_dataset }}"
    private_cloud_service_storage_size: "{{ private_cloud.onlyoffice.storage_size }}"

- name: Inspect existing OnlyOffice storage and credentials
  kubernetes.core.k8s_info:
    kubeconfig: "{{ onlyoffice_kubeconfig }}"
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ item.namespace | default(omit) }}"
  loop:
    - {api_version: v1, kind: PersistentVolume, name: onlyoffice-data}
    - {api_version: v1, kind: PersistentVolumeClaim, name: onlyoffice-data, namespace: private-cloud}
    - {api_version: v1, kind: Secret, name: onlyoffice-credentials, namespace: private-cloud}
  register: onlyoffice_existing
  changed_when: false
  no_log: true

- name: Reject incompatible OnlyOffice persistent storage
  ansible.builtin.assert:
    that:
      - onlyoffice_existing.results[0].resources | length == 0 or onlyoffice_existing.results[0].resources[0].spec.local.path == onlyoffice_dataset_mountpoint
      - onlyoffice_existing.results[0].resources | length == 0 or onlyoffice_existing.results[0].resources[0].spec.capacity.storage == onlyoffice_pv_capacity
      - onlyoffice_existing.results[0].resources | length == 0 or onlyoffice_node_name in onlyoffice_existing.results[0].resources[0].spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values
      - onlyoffice_existing.results[1].resources | length == 0 or onlyoffice_existing.results[1].resources[0].spec.resources.requests.storage == onlyoffice_pv_capacity
      - onlyoffice_existing.results[1].resources | length == 0 or onlyoffice_existing.results[1].resources[0].spec.volumeName == onlyoffice_pv_name
    fail_msg: Existing OnlyOffice persistent storage conflicts with the configured local storage.

- name: Classify the existing OnlyOffice credentials
  ansible.builtin.set_fact:
    onlyoffice_secret_present: "{{ onlyoffice_existing.results[2].resources | length > 0 }}"
    onlyoffice_secret_managed: >-
      {{ onlyoffice_existing.results[2].resources | length > 0 and
         ((onlyoffice_existing.results[2].resources[0].metadata.annotations | default({})).get('private-cloud.example/managed-by', '') == 'ansible') }}
    onlyoffice_secret_matches: >-
      {{ onlyoffice_existing.results[2].resources | length > 0 and
         onlyoffice_existing.results[2].resources[0].data.JWT_SECRET is defined and
         (onlyoffice_existing.results[2].resources[0].data.JWT_SECRET | b64decode == private_cloud_secrets.onlyoffice.jwt_secret) }}
  no_log: true

- name: Reject incompatible unmanaged OnlyOffice credentials
  ansible.builtin.assert:
    that: not onlyoffice_secret_present | bool or onlyoffice_secret_matches | bool or onlyoffice_secret_managed | bool
    fail_msg: Existing OnlyOffice credentials conflict with the configured JWT secret.
  no_log: true

- name: Apply OnlyOffice credentials
  kubernetes.core.k8s:
    kubeconfig: "{{ onlyoffice_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', 'secret.yml.j2') | from_yaml }}"
  register: onlyoffice_secret_apply
  when: not onlyoffice_secret_present | bool or not onlyoffice_secret_matches | bool
  no_log: true

- name: Render OnlyOffice manifests from the authoritative base
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/render_manifests.yml"
  vars:
    manifest_service: onlyoffice
    manifest_base: "{{ role_path }}/../../../k0s-services/onlyoffice/kustomize/base"
    manifest_kustomize_command: "{{ onlyoffice_kustomize_command }}"
    manifest_values:
      dataset_path: "{{ onlyoffice_dataset_mountpoint }}"
      node_name: "{{ onlyoffice_node_name }}"
      image: "{{ onlyoffice_image }}"
      memory: "{{ private_cloud.onlyoffice.max_ram }}"
      node_port: "{{ private_cloud.onlyoffice.node_port }}"

- name: Select OnlyOffice manifest stages
  ansible.builtin.set_fact:
    onlyoffice_storage_manifests: >-
      {{ private_cloud_rendered_manifests
         | selectattr("kind", "in", ["PersistentVolume", "PersistentVolumeClaim"]) | list }}
    onlyoffice_workload_manifests: >-
      {{ private_cloud_rendered_manifests
         | rejectattr("kind", "in", ["PersistentVolume", "PersistentVolumeClaim"]) | list }}

- name: Apply OnlyOffice storage
  kubernetes.core.k8s:
    kubeconfig: "{{ onlyoffice_kubeconfig }}"
    state: present
    definition: "{{ onlyoffice_storage_manifests }}"

- name: Apply OnlyOffice workload
  kubernetes.core.k8s:
    kubeconfig: "{{ onlyoffice_kubeconfig }}"
    state: present
    definition: "{{ onlyoffice_workload_manifests }}"

- name: Restart OnlyOffice after a credentials change
  kubernetes.core.k8s:
    kubeconfig: "{{ onlyoffice_kubeconfig }}"
    state: patched
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ onlyoffice_service_name }}"
        namespace: "{{ onlyoffice_namespace }}"
      spec:
        template:
          metadata:
            annotations:
              private-cloud.example/credentials-restarted-at: "{{ ansible_date_time.iso8601 }}"
  when: onlyoffice_secret_apply.changed | default(false)
  no_log: true

- name: Wait for OnlyOffice deployment
  kubernetes.core.k8s_info:
    kubeconfig: "{{ onlyoffice_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    name: "{{ onlyoffice_service_name }}"
    namespace: "{{ onlyoffice_namespace }}"
  register: onlyoffice_deployment
  until:
    - onlyoffice_deployment.resources | length > 0
    - onlyoffice_deployment.resources[0].status.observedGeneration | default(0) | int >= onlyoffice_deployment.resources[0].metadata.generation | int
    - onlyoffice_deployment.resources[0].status.updatedReplicas | default(0) | int == onlyoffice_deployment.resources[0].spec.replicas | default(1) | int
    - onlyoffice_deployment.resources[0].status.readyReplicas | default(0) | int == onlyoffice_deployment.resources[0].spec.replicas | default(1) | int
    - onlyoffice_deployment.resources[0].status.availableReplicas | default(0) | int == onlyoffice_deployment.resources[0].spec.replicas | default(1) | int
  retries: 90
  delay: 5
  changed_when: false

- name: Wait for OnlyOffice service endpoint
  kubernetes.core.k8s_info:
    kubeconfig: "{{ onlyoffice_kubeconfig }}"
    api_version: v1
    kind: Endpoints
    name: "{{ onlyoffice_service_name }}"
    namespace: "{{ onlyoffice_namespace }}"
  register: onlyoffice_endpoint
  until: onlyoffice_endpoint.resources | length > 0 and (onlyoffice_endpoint.resources[0].subsets | default([]) | selectattr('addresses', 'defined') | list | length > 0)
  retries: 90
  delay: 5
  changed_when: false
