---
- name: Resolve the Alloy monitoring endpoint
  kubernetes.core.k8s_info:
    kubeconfig: /run/private-cloud/kubeconfig
    api_version: v1
    kind: Service
    name: alloy
    namespace: observability
  register: observability_alloy_service
  changed_when: false

- name: Select certificate endpoints
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/observability_certificates.yml"

- name: Copy Alloy and certificate health collector
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../logging/{{ item }}"
    dest: "/usr/local/libexec/zabbix/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: [health.py, health_helpers.py]
  notify: Restart Zabbix Agent 2

- name: Configure Alloy and certificate health probe targets
  ansible.builtin.copy:
    dest: /etc/zabbix/private-cloud-observability.json
    content: >-
      {{ {'endpoints': {
        'alloy': 'http://' ~ observability_alloy_service.resources[0].spec.clusterIP ~ ':12345'
      }, 'address': private_cloud.networking.traefik_internal_ip,
      'certificates': observability_certificates} | to_nice_json }}
    owner: root
    group: root
    mode: '0644'
  notify: Restart Zabbix Agent 2

- name: Enable Alloy and certificate health user parameter
  ansible.builtin.copy:
    dest: /etc/zabbix/zabbix_agent2.d/observability.conf
    content: "UserParameter=observability.health,/usr/bin/python3 /usr/local/libexec/zabbix/health.py /etc/zabbix/private-cloud-observability.json\n"
    owner: root
    group: root
    mode: '0644'
  notify: Restart Zabbix Agent 2
