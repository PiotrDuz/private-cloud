---
- name: Require the supported public schema version
  ansible.builtin.assert:
    that:
      - schema_version == 7
    fail_msg: Public configuration schema version is unsupported

- name: Require supported Debian-family target
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ['Ubuntu', 'Debian']
    fail_msg: The target must be Ubuntu or Debian

- name: Require root execution
  ansible.builtin.assert:
    that:
      - ansible_facts.effective_user_id | int == 0
    fail_msg: Ansible must run with effective UID 0

- name: Require the public contract sections
  ansible.builtin.assert:
    that:
      - private_cloud is mapping
      - (private_cloud.keys() | list | difference(['stages', 'storage', 'k0s', 'networking', 'media', 'postgres', 'meilisearch', 'tika', 'bleve', 'onlyoffice', 'opencloud', 'grist', 'manticore', 'redis_affine', 'affine', 'immich', 'stalwart', 'zabbix', 'logging', 'notifications']) | length) == 0
      - (['stages', 'storage', 'k0s', 'networking', 'media', 'postgres', 'meilisearch', 'tika', 'bleve', 'onlyoffice', 'opencloud', 'grist', 'manticore', 'redis_affine', 'affine', 'immich', 'stalwart', 'zabbix', 'logging', 'notifications'] | difference(private_cloud.keys() | list) | length) == 0
    fail_msg: Public configuration has missing or unknown sections

- name: Require exact nested public schema
  ansible.builtin.assert:
    that:
      - (private_cloud.stages.keys() | list | sort) == ['affine', 'bleve', 'grist', 'immich', 'intel_gpu', 'k0s', 'logging', 'manticore', 'media', 'meilisearch', 'networking', 'notifications', 'onlyoffice', 'opencloud', 'postgres', 'redis_affine', 'stalwart', 'tika', 'zabbix_agent', 'zabbix_server', 'zfs']
      - (private_cloud.storage.keys() | list) == ['disks']
      - (private_cloud.k0s.keys() | list | sort) == ['config_quota', 'ephemeral_quota', 'images_quota']
      - (private_cloud.networking.keys() | list | sort) == ['acme_email', 'amneziawg', 'cloudflare_zone_id', 'cluster_dns_ip', 'local_network_cidrs', 'managed_records', 'pod_cidr', 'public_ip_url', 'service_cidr', 'storage_size', 'traefik_internal_ip', 'zabbix_hostname']
      - (private_cloud.networking.amneziawg.keys() | list | sort) == ['address', 'hostname', 'listen_port', 'peers', 'tunnel_cidr']
      - (private_cloud.media.keys() | list | sort) == ['hostname', 'openvpn', 'quality_profiles', 'storage_size', 'timezone']
      - (private_cloud.media.quality_profiles.keys() | list | sort) == ['radarr', 'sonarr']
      - (private_cloud.media.openvpn.keys() | list | sort) == ['endpoint_ip', 'endpoint_port', 'endpoint_protocol', 'gateway_cluster_ip']
      - (private_cloud.postgres.keys() | list | sort) == ['max_ram', 'volume_size']
      - (private_cloud.meilisearch.keys() | list | sort) == ['max_ram', 'storage_size']
      - (private_cloud.tika.keys() | list | sort) == ['max_ram', 'storage_size']
      - (private_cloud.bleve.keys() | list) == ['storage_size']
      - (private_cloud.onlyoffice.keys() | list | sort) == ['hostname', 'max_ram', 'storage_size']
      - (private_cloud.opencloud.keys() | list | sort) == ['hostname', 'max_ram', 'storage_size']
      - (private_cloud.grist.keys() | list | sort) == ['default_email', 'hostname', 'max_ram', 'storage_size']
      - (private_cloud.manticore.keys() | list | sort) == ['max_ram', 'storage_size']
      - (private_cloud.redis_affine.keys() | list) == ['max_ram']
      - (private_cloud.affine.keys() | list | sort) == ['hostname', 'max_ram', 'storage_size']
      - (private_cloud.immich.keys() | list | sort) == ['hostname', 'machine_learning_accelerator', 'machine_learning_max_ram', 'max_ram', 'storage_size', 'timezone', 'valkey_max_ram']
      - (private_cloud.stalwart.keys() | list | sort) == ['acme_contact', 'admin_username', 'domain', 'forwarding_domain', 'hostname', 'mailbox_username', 'max_ram', 'relay_host', 'relay_implicit_tls', 'relay_port', 'relay_username', 'storage_size']
      - (private_cloud.zabbix.keys() | list | sort) == ['admin_username', 'storage_size']
      - (private_cloud.logging.keys() | list | sort) == ['alloy_max_ram', 'alloy_storage_size', 'hostname', 'openobserve_max_ram', 'openobserve_storage_size', 'retention_days']
      - (private_cloud.notifications.keys() | list) == ['from_address']
    fail_msg: Public configuration has missing or unknown nested keys

- name: Require the supported encrypted schema version
  ansible.builtin.assert:
    that:
      - secrets_schema_version == 3
    fail_msg: Encrypted configuration schema version is unsupported
  no_log: true

- name: Require known encrypted sections
  ansible.builtin.assert:
    that:
      - private_cloud_secrets is mapping
      - (private_cloud_secrets.keys() | list | difference(['affine', 'grist', 'immich', 'logging', 'media', 'meilisearch', 'networking', 'onlyoffice', 'opencloud', 'postgres', 'stalwart', 'storage', 'zabbix']) | length) == 0
    fail_msg: Encrypted configuration has unknown sections
  no_log: true

- name: Require known encrypted keys
  ansible.builtin.assert:
    that:
      - item.name not in private_cloud_secrets or private_cloud_secrets[item.name] is mapping
      - item.name not in private_cloud_secrets or (private_cloud_secrets[item.name].keys() | list | difference(item['keys']) | length) == 0
    fail_msg: Encrypted configuration has unknown nested keys
  loop:
    - {name: storage, keys: [encryption_passphrase]}
    - {name: postgres, keys: [admin_password]}
    - {name: meilisearch, keys: [master_key]}
    - {name: stalwart, keys: [admin_password, certificate_dns_api_token, database_password, mailbox_password, relay_password]}
    - {name: zabbix, keys: [admin_password, database_password]}
    - {name: logging, keys: [admin_password]}
    - {name: onlyoffice, keys: [jwt_secret]}
    - {name: opencloud, keys: [admin_password]}
    - {name: grist, keys: [boot_key, database_password, session_secret]}
    - {name: affine, keys: [database_password]}
    - {name: immich, keys: [database_password]}
    - {name: networking, keys: [amneziawg_private_key, cloudflare_api_token, cloudflare_ddns_api_token]}
    - {name: media, keys: [openvpn_configuration, openvpn_password, openvpn_username, proxy_password, qbittorrent_password]}
  no_log: true

- name: Validate logging and notification configuration
  ansible.builtin.command:
    argv: [python3, -c, "import json,sys; from install_helpers import validate_public_configuration; validate_public_configuration(json.load(sys.stdin))"]
    chdir: "{{ playbook_dir }}"
    stdin: "{{ {'schema_version': schema_version, 'private_cloud': private_cloud} | to_json }}"
  changed_when: false

- name: Require OpenObserve credentials
  ansible.builtin.assert:
    that:
      - private_cloud_secrets.logging.admin_password is string
      - private_cloud_secrets.logging.admin_password | length >= 32
  when: private_cloud.stages.logging | bool
  no_log: true

- name: Require qBittorrent credentials
  ansible.builtin.assert:
    that:
      - private_cloud_secrets.media.qbittorrent_password is string
      - private_cloud_secrets.media.qbittorrent_password | length >= 16
    fail_msg: The qBittorrent WebUI password must contain at least 16 characters.
  when: private_cloud.stages.media | bool
  no_log: true

- name: Require Boolean stage flags
  ansible.builtin.assert:
    that:
      - private_cloud.stages[item] is boolean
    fail_msg: Every stage flag must be Boolean
  loop: [zfs, k0s, networking, media, intel_gpu, postgres, meilisearch, stalwart, tika, bleve, onlyoffice, opencloud, grist, manticore, redis_affine, affine, immich, logging, notifications, zabbix_server, zabbix_agent]

- name: Require stage dependencies
  ansible.builtin.assert:
    that:
      - not private_cloud.stages[item.key] or (item.value | map('extract', private_cloud.stages) | select('equalto', false) | list | length) == 0
    fail_msg: Enabled stages must follow the dependency chain
  loop: "{{ private_cloud_stage_dependencies | dict2items }}"

- name: Require Ubuntu for the Zabbix Agent stage
  ansible.builtin.assert:
    that: ansible_facts.distribution == 'Ubuntu'
    fail_msg: The Zabbix Agent stage requires Ubuntu
  when: private_cloud.stages.zabbix_agent | bool

- name: Require k0s values
  ansible.builtin.assert:
    that:
      - private_cloud.k0s.config_quota is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.k0s.images_quota is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.k0s.ephemeral_quota is match('^[1-9][0-9]*[KMGTPE]$')
    fail_msg: k0s configuration is invalid

- name: Require networking values
  ansible.builtin.assert:
    that:
      - private_cloud.networking.storage_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.networking.acme_email is match('^[^@ ]+@[^@ ]+\.[^@ ]+$')
      - private_cloud.networking.cloudflare_zone_id is match('^[0-9a-fA-F]{32}$')
      - private_cloud.networking.public_ip_url is match('^https://')
      - private_cloud.networking.managed_records | length > 0
      - private_cloud.networking.local_network_cidrs | length > 0
      - private_cloud.networking.amneziawg.peers | length > 0
    fail_msg: Networking configuration is invalid

- name: Require media values
  ansible.builtin.assert:
    that:
      - private_cloud.media.storage_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.media.hostname is match('^(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$')
      - private_cloud.media.timezone is match('^[A-Za-z_+-]+/[A-Za-z_+/-]+$')
      - private_cloud.media.quality_profiles.sonarr in ['720p', '1080p', '2160p']
      - private_cloud.media.quality_profiles.radarr in ['720p', '1080p', '2160p']
      - private_cloud.media.openvpn.endpoint_protocol in ['TCP', 'UDP']
      - private_cloud.media.openvpn.endpoint_port | int >= 1
      - private_cloud.media.openvpn.endpoint_port | int <= 65535
    fail_msg: Media configuration is invalid


- name: Require the k0s amd64 and systemd host capabilities
  ansible.builtin.assert:
    that:
      - ansible_facts.architecture == 'x86_64'
      - ansible_facts.service_mgr == 'systemd'
    fail_msg: The managed k0s release requires an amd64 systemd host.
  when: private_cloud.stages.k0s | bool

- name: Check the cgroup-v2 controller interface for k0s
  ansible.builtin.stat:
    path: /sys/fs/cgroup/cgroup.controllers
  register: preflight_cgroup_v2
  when: private_cloud.stages.k0s | bool

- name: Require cgroup-v2 for k0s
  ansible.builtin.assert:
    that: preflight_cgroup_v2.stat.exists
    fail_msg: The managed k0s release requires a cgroup-v2 host.
  when: private_cloud.stages.k0s | bool

- name: Require PostgreSQL values
  ansible.builtin.assert:
    that:
      - private_cloud.postgres.volume_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.postgres.max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
      - (private_cloud.postgres.max_ram | human_to_bytes | int) >= 536870912
    fail_msg: PostgreSQL size configuration is invalid

- name: Require Meilisearch values
  ansible.builtin.assert:
    that:
      - private_cloud.meilisearch.storage_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.meilisearch.max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
    fail_msg: Meilisearch configuration is invalid

- name: Require Tika values
  ansible.builtin.assert:
    that:
      - private_cloud.tika.storage_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.tika.max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
    fail_msg: Tika configuration is invalid

- name: Require Bleve values
  ansible.builtin.assert:
    that:
      - private_cloud.bleve.storage_size is match('^[1-9][0-9]*[KMGTPE]$')
    fail_msg: Bleve configuration is invalid

- name: Require OnlyOffice values
  ansible.builtin.assert:
    that:
      - private_cloud.onlyoffice.storage_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.onlyoffice.max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
      - (private_cloud.onlyoffice.max_ram | human_to_bytes | int) >= 4294967296
      - private_cloud.onlyoffice.hostname is match('^(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$')
    fail_msg: OnlyOffice configuration is invalid

- name: Require OpenCloud values
  ansible.builtin.assert:
    that:
      - private_cloud.opencloud.storage_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.opencloud.max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
      - private_cloud.opencloud.hostname is match('^(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$')
      - private_cloud.opencloud.hostname != private_cloud.onlyoffice.hostname
    fail_msg: OpenCloud configuration is invalid

- name: Require Grist values
  ansible.builtin.assert:
    that:
      - private_cloud.grist.storage_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.grist.max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
      - (private_cloud.grist.max_ram | human_to_bytes | int) >= 536870912
      - private_cloud.grist.default_email is match("^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,63}$")
      - private_cloud.grist.hostname is match('^(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$')
    fail_msg: Grist configuration is invalid

- name: Require Manticore values
  ansible.builtin.assert:
    that:
      - private_cloud.manticore.storage_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.manticore.max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
    fail_msg: Manticore configuration is invalid

- name: Require Redis for AFFiNE values
  ansible.builtin.assert:
    that:
      - private_cloud.redis_affine.max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
      - (private_cloud.redis_affine.max_ram | human_to_bytes | int) >= 134217728
    fail_msg: Redis for AFFiNE configuration is invalid

- name: Require AFFiNE values
  ansible.builtin.assert:
    that:
      - private_cloud.affine.storage_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.affine.max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
      - (private_cloud.affine.max_ram | human_to_bytes | int) >= 2147483648
      - private_cloud.affine.hostname is match('^(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$')
    fail_msg: AFFiNE configuration is invalid

- name: Require Immich values
  ansible.builtin.assert:
    that:
      - private_cloud.immich.storage_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.immich.max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
      - private_cloud.immich.machine_learning_max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
      - private_cloud.immich.valkey_max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
      - (private_cloud.immich.max_ram | human_to_bytes | int) >= 2147483648
      - (private_cloud.immich.machine_learning_max_ram | human_to_bytes | int) >= 1073741824
      - (private_cloud.immich.valkey_max_ram | human_to_bytes | int) >= 134217728
      - private_cloud.immich.machine_learning_accelerator in ['cpu', 'openvino']
      - private_cloud.immich.machine_learning_accelerator != 'openvino' or private_cloud.stages.intel_gpu | bool
      - private_cloud.immich.timezone is match('^[A-Za-z_+-]+/[A-Za-z_+/-]+$')
      - private_cloud.immich.hostname is match('^(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$')
    fail_msg: Immich configuration is invalid

- name: Require unique public application hostnames
  ansible.builtin.assert:
    that:
      - ([private_cloud.onlyoffice.hostname, private_cloud.opencloud.hostname, private_cloud.grist.hostname, private_cloud.affine.hostname, private_cloud.immich.hostname] | unique | length) == 5
    fail_msg: Every public application hostname must be unique

- name: Require Stalwart values
  ansible.builtin.assert:
    that:
      - private_cloud.stalwart.storage_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.stalwart.max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
      - private_cloud.stalwart.domain is match('^(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$')
      - private_cloud.stalwart.forwarding_domain is match('^(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$')
      - private_cloud.stalwart.hostname is match('^(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$')
      - private_cloud.stalwart.relay_host is match('^(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$')
      - private_cloud.stalwart.forwarding_domain != private_cloud.stalwart.domain
      - private_cloud.stalwart.forwarding_domain.endswith('.' ~ private_cloud.stalwart.domain)
      - private_cloud.stalwart.hostname != private_cloud.stalwart.domain
      - private_cloud.stalwart.hostname.endswith('.' ~ private_cloud.stalwart.domain)
      - private_cloud.stalwart.hostname != private_cloud.stalwart.forwarding_domain
      - private_cloud.stalwart.acme_contact is match("^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,63}$")
      - private_cloud.stalwart.relay_username is match("^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,63}$")
      - private_cloud.stalwart.admin_username is match('^[A-Za-z0-9](?:[A-Za-z0-9._+-]{0,62}[A-Za-z0-9])?$')
      - private_cloud.stalwart.mailbox_username is match('^[A-Za-z0-9](?:[A-Za-z0-9._+-]{0,62}[A-Za-z0-9])?$')
      - private_cloud.stalwart.admin_username != private_cloud.stalwart.mailbox_username
      - private_cloud.stalwart.relay_port is integer
      - private_cloud.stalwart.relay_port >= 1
      - private_cloud.stalwart.relay_port <= 65535
      - private_cloud.stalwart.relay_implicit_tls is boolean
    fail_msg: Stalwart configuration is invalid

- name: Require Zabbix values
  ansible.builtin.assert:
    that:
      - private_cloud.zabbix.storage_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.zabbix.admin_username is string
      - private_cloud.zabbix.admin_username | length > 0
      - private_cloud.zabbix.admin_username is match('^[^\r\n]+$')
    fail_msg: Zabbix configuration is invalid

- name: Require repository-managed Zabbix host settings
  ansible.builtin.assert:
    that:
      - private_cloud_zabbix_hostname is string
      - private_cloud_zabbix_hostname | length > 0
      - private_cloud_zabbix_hostname | length <= 128
      - private_cloud_zabbix_hostname is match('^[^\r\n]+$')
      - private_cloud_zabbix_agent_server_active is match('^[^\s,:]+(?::(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?$')
    fail_msg: Repository-managed Zabbix host settings are invalid

- name: Require storage disk contract when ZFS is enabled
  ansible.builtin.set_fact:
    preflight_unique_disks: "{{ private_cloud.storage.disks | unique | list }}"
  when: private_cloud.stages.zfs | bool

- name: Validate storage disk contract when ZFS is enabled
  ansible.builtin.assert:
    that:
      - private_cloud.storage.disks is sequence
      - private_cloud.storage.disks is not string
      - private_cloud.storage.disks | length >= 2
      - preflight_unique_disks | length == private_cloud.storage.disks | length
      - item is string
      - item is match('^/dev/disk/by-id/')
    fail_msg: ZFS disks must be unique stable /dev/disk/by-id paths
  loop: "{{ private_cloud.storage.disks }}"
  when: private_cloud.stages.zfs | bool

- name: Require storage secret when ZFS is enabled
  ansible.builtin.assert:
    that:
      - private_cloud_secrets is mapping
      - private_cloud_secrets.storage.encryption_passphrase is string
      - private_cloud_secrets.storage.encryption_passphrase | length > 0
    fail_msg: Required encrypted secrets are missing
  when: private_cloud.stages.zfs | bool
  no_log: true

- name: Require PostgreSQL secret when PostgreSQL is enabled
  ansible.builtin.assert:
    that:
      - private_cloud_secrets.postgres.admin_password is string
      - private_cloud_secrets.postgres.admin_password | length > 0
    fail_msg: Required encrypted secrets are missing
  when: private_cloud.stages.postgres | bool
  no_log: true

- name: Require Meilisearch secret when Meilisearch is enabled
  ansible.builtin.assert:
    that:
      - private_cloud_secrets.meilisearch.master_key is string
      - private_cloud_secrets.meilisearch.master_key | length >= 16
    fail_msg: Required encrypted secrets are missing
  when: private_cloud.stages.meilisearch | bool
  no_log: true

- name: Require OnlyOffice secret when OnlyOffice is enabled
  ansible.builtin.assert:
    that:
      - private_cloud_secrets.onlyoffice.jwt_secret is string
      - private_cloud_secrets.onlyoffice.jwt_secret | length >= 32
    fail_msg: Required encrypted secrets are missing
  when: private_cloud.stages.onlyoffice | bool
  no_log: true

- name: Require OpenCloud secret when OpenCloud is enabled
  ansible.builtin.assert:
    that:
      - private_cloud_secrets.opencloud.admin_password is string
      - private_cloud_secrets.opencloud.admin_password | length > 0
    fail_msg: Required encrypted secrets are missing
  when: private_cloud.stages.opencloud | bool
  no_log: true

- name: Require Grist secrets when Grist is enabled
  ansible.builtin.assert:
    that:
      - private_cloud_secrets.grist.database_password is string
      - private_cloud_secrets.grist.database_password | length > 0
      - private_cloud_secrets.grist.session_secret is string
      - private_cloud_secrets.grist.session_secret | length >= 32
      - private_cloud_secrets.grist.boot_key is string
      - private_cloud_secrets.grist.boot_key | length >= 16
    fail_msg: Required encrypted secrets are missing
  when: private_cloud.stages.grist | bool
  no_log: true

- name: Require AFFiNE secret when AFFiNE is enabled
  ansible.builtin.assert:
    that:
      - private_cloud_secrets.affine.database_password is string
      - private_cloud_secrets.affine.database_password | length >= 16
    fail_msg: Required encrypted secrets are missing
  when: private_cloud.stages.affine | bool
  no_log: true

- name: Require Immich secret when Immich is enabled
  ansible.builtin.assert:
    that:
      - private_cloud_secrets.immich.database_password is string
      - private_cloud_secrets.immich.database_password | length >= 16
    fail_msg: Required encrypted secrets are missing
  when: private_cloud.stages.immich | bool
  no_log: true

- name: Require Stalwart secrets when Stalwart is enabled
  ansible.builtin.assert:
    that:
      - private_cloud_secrets.stalwart.database_password is string
      - private_cloud_secrets.stalwart.database_password | length > 0
      - private_cloud_secrets.stalwart.admin_password is string
      - private_cloud_secrets.stalwart.admin_password | length > 0
      - private_cloud_secrets.stalwart.mailbox_password is string
      - private_cloud_secrets.stalwart.mailbox_password | length > 0
      - private_cloud_secrets.stalwart.relay_password is string
      - private_cloud_secrets.stalwart.relay_password | length > 0
      - private_cloud_secrets.stalwart.certificate_dns_api_token is string
      - private_cloud_secrets.stalwart.certificate_dns_api_token | length >= 20
    fail_msg: Required encrypted secrets are missing
  when: private_cloud.stages.stalwart | bool
  no_log: true

- name: Require networking secrets when networking is enabled
  ansible.builtin.assert:
    that:
      - private_cloud_secrets.networking.cloudflare_api_token is string
      - private_cloud_secrets.networking.cloudflare_api_token | length >= 20
      - private_cloud_secrets.networking.cloudflare_ddns_api_token is string
      - private_cloud_secrets.networking.cloudflare_ddns_api_token | length >= 20
      - private_cloud_secrets.networking.amneziawg_private_key is match('^[A-Za-z0-9+/]{43}=$')
    fail_msg: Required encrypted networking secrets are missing
  when: private_cloud.stages.networking | bool
  no_log: true

- name: Require media secrets when media is enabled
  ansible.builtin.assert:
    that:
      - private_cloud_secrets.media.openvpn_configuration is string
      - private_cloud_secrets.media.openvpn_configuration | length > 0
      - private_cloud_secrets.media.openvpn_username is string
      - private_cloud_secrets.media.openvpn_username | length > 0
      - private_cloud_secrets.media.openvpn_password is string
      - private_cloud_secrets.media.openvpn_password | length > 0
      - private_cloud_secrets.media.proxy_password is match('^[A-Za-z0-9_-]{16,64}$')
    fail_msg: Required encrypted media secrets are missing
  when: private_cloud.stages.media | bool
  no_log: true

- name: Require Zabbix secrets when Zabbix server is enabled
  ansible.builtin.assert:
    that:
      - private_cloud_secrets.zabbix.database_password is string
      - private_cloud_secrets.zabbix.database_password | length > 0
      - private_cloud_secrets.zabbix.admin_password is string
      - private_cloud_secrets.zabbix.admin_password | length > 0
    fail_msg: Required encrypted secrets are missing
  when: private_cloud.stages.zabbix_server | bool
  no_log: true

- name: Require a valid ZFS passphrase
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - import sys; print(len(sys.stdin.buffer.read()))
    stdin: "{{ private_cloud_secrets.storage.encryption_passphrase }}"
    stdin_add_newline: false
  register: preflight_passphrase_bytes
  changed_when: false
  no_log: true
  when: private_cloud.stages.zfs | bool

- name: Require a valid ZFS passphrase byte length
  ansible.builtin.assert:
    that:
      - preflight_passphrase_bytes.stdout | int >= 8
      - preflight_passphrase_bytes.stdout | int <= 512
  when: private_cloud.stages.zfs | bool
  no_log: true


- name: Check for an existing tank pool
  ansible.builtin.command: zpool list -H -o name tank
  register: preflight_tank
  changed_when: false
  failed_when: false

- name: Check for the managed encrypted root dataset
  ansible.builtin.command: zfs list -H -o name tank/secure
  register: preflight_secure
  changed_when: false
  failed_when: false

- name: Inspect the partial ZFS creation marker
  ansible.builtin.stat:
    path: /var/lib/private-cloud/zfs-create-intent.json
    follow: false
  register: preflight_create_intent_stat
  when: private_cloud.stages.zfs | bool

- name: Require a safe partial ZFS creation marker when present
  ansible.builtin.assert:
    that:
      - not (preflight_create_intent_stat.stat.islnk | default(false))
      - preflight_create_intent_stat.stat.isreg | default(false)
      - preflight_create_intent_stat.stat.uid | int == 0
      - preflight_create_intent_stat.stat.mode == '0600'
    fail_msg: The partial ZFS creation marker must be a root-owned regular 0600 file.
  when:
    - private_cloud.stages.zfs | bool
    - preflight_create_intent_stat.stat.exists | default(false) or preflight_create_intent_stat.stat.islnk | default(false)

- name: Read the partial ZFS creation marker
  ansible.builtin.slurp:
    src: /var/lib/private-cloud/zfs-create-intent.json
  register: preflight_create_intent_content
  when:
    - private_cloud.stages.zfs | bool
    - preflight_create_intent_stat.stat.exists
    - preflight_create_intent_stat.stat.isreg
    - not preflight_create_intent_stat.stat.islnk

- name: Parse the partial ZFS creation marker
  ansible.builtin.set_fact:
    preflight_create_intent: "{{ preflight_create_intent_content.content | b64decode | from_json }}"
  when: preflight_create_intent_content is defined and preflight_create_intent_content.content is defined

- name: Match the partial ZFS creation marker to the current contract
  ansible.builtin.set_fact:
    preflight_create_intent_matches: >-
      {{ (preflight_create_intent | default({})) ==
         {'pool': 'tank', 'topology': 'raidz1', 'disks': private_cloud.storage.disks} }}
  when: private_cloud.stages.zfs | bool

- name: Validate an existing tank pool layout read-only
  ansible.builtin.command: >-
    python3 {{ playbook_dir }}/storage_checks.py pool-layout --pool tank --disks
    {{ private_cloud.storage.disks | map('quote') | join(' ') }}
  register: preflight_pool_layout
  changed_when: false
  failed_when: false
  when:
    - private_cloud.stages.zfs | bool
    - preflight_tank.rc == 0
    - preflight_secure.rc != 0
    - preflight_create_intent_matches | default(false) | bool

- name: Check native OpenZFS mount generator availability
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/lib/systemd/system-generators/zfs-mount-generator
    - /lib/systemd/system-generators/zfs-mount-generator
  register: preflight_mount_generator
  when: private_cloud.stages.zfs | bool

- name: Inspect the OpenZFS candidate package for the native generator
  ansible.builtin.shell: >-
    set -eu;
    if test -x /usr/lib/systemd/system-generators/zfs-mount-generator || test -x /lib/systemd/system-generators/zfs-mount-generator; then exit 0; fi;
    work=$(mktemp -d /run/private-cloud/zfs-package.XXXXXX);
    trap 'rm -rf "$work"' EXIT;
    (cd "$work" && apt-get download zfsutils-linux >/dev/null 2>&1);
    deb=$(find "$work" -maxdepth 1 -type f -name 'zfsutils-linux_*.deb' -print -quit);
    test -n "$deb";
    dpkg-deb --contents "$deb" | awk '$1 ~ /^-..x/ && $6 ~ /(^|\/)systemd\/system-generators\/zfs-mount-generator$/ { found=1 } END { exit found ? 0 : 1 }'
  register: preflight_zfs_package
  changed_when: false
  failed_when: false
  when: private_cloud.stages.zfs | bool

- name: Require native OpenZFS mount generation
  ansible.builtin.assert:
    that:
      - (preflight_mount_generator.results | selectattr('stat.executable') | list | length) > 0 or preflight_zfs_package.rc == 0
    fail_msg: zfsutils-linux must provide an executable zfs-mount-generator
  when: private_cloud.stages.zfs | bool

- name: Check required repository assets on the controller
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ playbook_dir }}/../zabbix/zabbix-zfs-collector.py"
    - "{{ playbook_dir }}/../zabbix/zabbix-memory-ecc-collector.py"
    - "{{ playbook_dir }}/../zabbix/zabbix-smartctl-wrapper"
    - "{{ playbook_dir }}/../zabbix/zabbix-zfs-template.yaml"
    - "{{ playbook_dir }}/../zabbix/zabbix-memory-ecc-template.yaml"
  delegate_to: localhost
  register: preflight_assets
  when: private_cloud.stages.zabbix_agent or private_cloud.stages.zabbix_server

- name: Require repository assets
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: A required repository runtime asset is missing
  loop: "{{ preflight_assets.results | default([]) }}"
  when: private_cloud.stages.zabbix_agent or private_cloud.stages.zabbix_server

- name: Require executable collector assets
  ansible.builtin.assert:
    that:
      - preflight_assets.results[0].stat.executable
      - preflight_assets.results[1].stat.executable
      - preflight_assets.results[2].stat.executable
      - not preflight_assets.results[3].stat.executable
      - not preflight_assets.results[4].stat.executable
    fail_msg: Repository asset modes do not match the runtime contract
  when: private_cloud.stages.zabbix_agent or private_cloud.stages.zabbix_server

- name: Extract repository template UUID values
  ansible.builtin.set_fact:
    preflight_template_uuids: "{{ (preflight_template_uuids | default([])) + (lookup('file', item) | regex_findall('(?m)^\\s*-?\\s*uuid:\\s*([0-9a-fA-F-]+)\\s*$')) }}"
  loop:
    - "{{ playbook_dir }}/../zabbix/zabbix-zfs-template.yaml"
    - "{{ playbook_dir }}/../zabbix/zabbix-memory-ecc-template.yaml"
  delegate_to: localhost
  when: private_cloud.stages.zabbix_agent or private_cloud.stages.zabbix_server

- name: Require unique UUIDv4-compatible template identifiers
  ansible.builtin.set_fact:
    preflight_unique_template_uuids: "{{ preflight_template_uuids | unique | list }}"
  when: private_cloud.stages.zabbix_agent or private_cloud.stages.zabbix_server

- name: Validate unique UUIDv4-compatible template identifiers
  ansible.builtin.assert:
    that:
      - preflight_unique_template_uuids | length == preflight_template_uuids | length
      - item is match('^[0-9a-fA-F]{12}4[0-9a-fA-F]{3}[89abAB][0-9a-fA-F]{3}[0-9a-fA-F]{12}$') or item is match('^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$')
    fail_msg: Repository template UUIDs must be unique UUIDv4-compatible values
  loop: "{{ preflight_template_uuids | default([]) }}"
  when: private_cloud.stages.zabbix_agent or private_cloud.stages.zabbix_server

- name: Require initial destructive authorization when applicable
  ansible.builtin.assert:
    that:
      - private_cloud_runtime.initial_install | default(false) | bool
      - private_cloud_runtime.storage_create_confirmation | default('') == 'CREATE tank'
    fail_msg: Initial pool creation requires the exact CREATE tank confirmation
  when:
    - private_cloud.stages.zfs | bool
    - preflight_tank.rc != 0
  no_log: true

- name: Reject an existing pool during an initial installation
  ansible.builtin.assert:
    that:
      - not (private_cloud_runtime.initial_install | default(false) | bool)
      - >-
        preflight_secure.rc == 0 or
        ((preflight_create_intent_matches | default(false) | bool) and
         (preflight_pool_layout.rc | default(1) | int == 0))
    fail_msg: Existing tank must contain the managed tank/secure dataset and cannot be adopted during initial installation
  when:
    - private_cloud.stages.zfs | bool
    - preflight_tank.rc == 0

- name: Check ZFS command availability when storage is disabled
  ansible.builtin.command: zfs version
  register: preflight_zfs_version
  changed_when: false
  failed_when: false
  when: not private_cloud.stages.zfs | bool

- name: Check stable disks before initial pool creation
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop: "{{ private_cloud.storage.disks }}"
  register: preflight_disk_stats
  when:
    - private_cloud.stages.zfs | bool
    - private_cloud_runtime.initial_install | default(false) | bool

- name: Require whole block devices
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isblk
    fail_msg: Every selected disk must resolve to a whole block device
  loop: "{{ preflight_disk_stats.results | default([]) }}"
  when:
    - private_cloud.stages.zfs | bool
    - private_cloud_runtime.initial_install | default(false) | bool

- name: Inspect selected disks recursively and read-only
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/storage_checks.py"
      - disk-safety
      - --disk
      - "{{ item }}"
      - --require-disk
  loop: "{{ private_cloud.storage.disks }}"
  register: preflight_disk_safety
  changed_when: false
  failed_when: false
  when:
    - private_cloud.stages.zfs | bool
    - private_cloud_runtime.initial_install | default(false) | bool
- name: Require selected disks to be inactive
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: A selected disk is mounted, active swap, held, or in an imported pool
  loop: "{{ preflight_disk_safety.results | default([]) }}"
  when:
    - private_cloud.stages.zfs | bool
    - private_cloud_runtime.initial_install | default(false) | bool

- name: Build fixed derived layout
  ansible.builtin.set_fact:
    private_cloud_layout:
      pool: tank
      pool_mountpoint: /tank
      secure_dataset: tank/secure
      secure_mountpoint: /tank/secure
      backup_dataset: tank/secure/backup
      no_backup_dataset: tank/secure/no-backup
      k0s_config_dataset: tank/secure/backup/k0s/config
      k0s_images_dataset: tank/secure/no-backup/k0s/images
      k0s_ephemeral_dataset: tank/secure/no-backup/k0s/ephemeral
      service_dataset_parent: tank/secure/backup/k0s/services
      kubernetes_namespace: private-cloud
      service_pv_capacity: 10Ti
      traefik_dataset: tank/secure/backup/k0s/services/traefik
      jellyfin_dataset: tank/secure/backup/k0s/services/jellyfin
      sonarr_dataset: tank/secure/backup/k0s/services/sonarr
      radarr_dataset: tank/secure/backup/k0s/services/radarr
      prowlarr_dataset: tank/secure/backup/k0s/services/prowlarr
      qbittorrent_dataset: tank/secure/backup/k0s/services/qbittorrent
      media_library_dataset: tank/secure/backup/k0s/services/media-library
      postgres_dataset: tank/secure/backup/k0s/services/postgres
      meilisearch_dataset: tank/secure/backup/k0s/services/meilisearch
      tika_dataset: tank/secure/backup/k0s/services/tika
      bleve_dataset: tank/secure/backup/k0s/services/bleve
      onlyoffice_dataset: tank/secure/backup/k0s/services/onlyoffice
      opencloud_dataset: tank/secure/backup/k0s/services/opencloud
      grist_dataset: tank/secure/backup/k0s/services/grist
      manticore_dataset: tank/secure/backup/k0s/services/manticore
      affine_dataset: tank/secure/backup/k0s/services/affine
      immich_dataset: tank/secure/backup/k0s/services/immich
      stalwart_dataset: tank/secure/backup/k0s/services/stalwart
      zabbix_dataset: tank/secure/backup/k0s/services/zabbix

- name: Check existing quota-bearing datasets without requiring a fresh host layout
  ansible.builtin.command: zfs get -Hp -o value used {{ item.dataset }}
  loop:
    - { dataset: 'tank/secure/backup/k0s/config', quota: '{{ private_cloud.k0s.config_quota }}' }
    - { dataset: 'tank/secure/no-backup/k0s/images', quota: '{{ private_cloud.k0s.images_quota }}' }
    - { dataset: 'tank/secure/no-backup/k0s/ephemeral', quota: '{{ private_cloud.k0s.ephemeral_quota }}' }
    - { dataset: 'tank/secure/backup/k0s/services/traefik', quota: '{{ private_cloud.networking.storage_size }}' }
    - { dataset: 'tank/secure/backup/k0s/services/jellyfin', quota: '{{ private_cloud.media.storage_size }}' }
    - { dataset: 'tank/secure/backup/k0s/services/sonarr', quota: '{{ private_cloud.media.storage_size }}' }
    - { dataset: 'tank/secure/backup/k0s/services/radarr', quota: '{{ private_cloud.media.storage_size }}' }
    - { dataset: 'tank/secure/backup/k0s/services/prowlarr', quota: '{{ private_cloud.media.storage_size }}' }
    - { dataset: 'tank/secure/backup/k0s/services/qbittorrent', quota: '{{ private_cloud.media.storage_size }}' }
    - { dataset: 'tank/secure/backup/k0s/services/media-library', quota: '{{ private_cloud.media.storage_size }}' }
    - { dataset: 'tank/secure/backup/k0s/services/postgres', quota: '{{ private_cloud.postgres.volume_size }}' }
    - { dataset: 'tank/secure/backup/k0s/services/meilisearch', quota: '{{ private_cloud.meilisearch.storage_size }}' }
    - { dataset: 'tank/secure/backup/k0s/services/tika', quota: '{{ private_cloud.tika.storage_size }}' }
    - { dataset: 'tank/secure/backup/k0s/services/bleve', quota: '{{ private_cloud.bleve.storage_size }}' }
    - { dataset: 'tank/secure/backup/k0s/services/onlyoffice', quota: '{{ private_cloud.onlyoffice.storage_size }}' }
    - { dataset: 'tank/secure/backup/k0s/services/opencloud', quota: '{{ private_cloud.opencloud.storage_size }}' }
    - { dataset: 'tank/secure/backup/k0s/services/grist', quota: '{{ private_cloud.grist.storage_size }}' }
    - { dataset: 'tank/secure/backup/k0s/services/manticore', quota: '{{ private_cloud.manticore.storage_size }}' }
    - { dataset: 'tank/secure/backup/k0s/services/affine', quota: '{{ private_cloud.affine.storage_size }}' }
    - { dataset: 'tank/secure/backup/k0s/services/immich', quota: '{{ private_cloud.immich.storage_size }}' }
    - { dataset: 'tank/secure/backup/k0s/services/stalwart', quota: '{{ private_cloud.stalwart.storage_size }}' }
    - { dataset: 'tank/secure/no-backup/k0s/services/openobserve', quota: '{{ private_cloud.logging.openobserve_storage_size }}' }
    - { dataset: 'tank/secure/no-backup/k0s/services/alloy', quota: '{{ private_cloud.logging.alloy_storage_size }}' }
    - { dataset: 'tank/secure/backup/k0s/services/zabbix', quota: '{{ private_cloud.zabbix.storage_size }}' }
  register: preflight_existing_usage
  changed_when: false
  failed_when: false

- name: Reject quota reductions below existing usage
  ansible.builtin.assert:
    that:
      - >-
        (item.item.quota[:-1] | int) * (1024 ** {'K': 1, 'M': 2, 'G': 3, 'T': 4, 'P': 5, 'E': 6}[item.item.quota[-1:]]) >= item.stdout | int
    fail_msg: A configured dataset quota cannot be reduced below existing usage
  loop: "{{ preflight_existing_usage.results }}"
  when: item.rc == 0 and item.stdout | trim != '-'


- name: Calculate enabled workload memory commitments
  ansible.builtin.set_fact:
    preflight_host_reserve_bytes: 8589934592
    preflight_transient_peak_bytes: >-
      {{ [
        (private_cloud.stages.affine | ternary(2147483648, 0)),
        (private_cloud.stages.postgres | ternary(536870912, 0)),
        (private_cloud.stages.stalwart | ternary(536870912, 0)),
        (private_cloud.stages.opencloud | ternary(536870912, 0))
      ] | max }}
    preflight_workload_memory_bytes: >-
      {{
        (private_cloud.stages.postgres | ternary(private_cloud.postgres.max_ram | human_to_bytes, 0)) +
        (private_cloud.stages.meilisearch | ternary(private_cloud.meilisearch.max_ram | human_to_bytes, 0)) +
        (private_cloud.stages.tika | ternary(private_cloud.tika.max_ram | human_to_bytes, 0)) +
        (private_cloud.stages.onlyoffice | ternary(private_cloud.onlyoffice.max_ram | human_to_bytes, 0)) +
        (private_cloud.stages.opencloud | ternary(private_cloud.opencloud.max_ram | human_to_bytes, 0)) +
        (private_cloud.stages.grist | ternary(private_cloud.grist.max_ram | human_to_bytes, 0)) +
        (private_cloud.stages.manticore | ternary(private_cloud.manticore.max_ram | human_to_bytes, 0)) +
        (private_cloud.stages.redis_affine | ternary(private_cloud.redis_affine.max_ram | human_to_bytes, 0)) +
        (private_cloud.stages.affine | ternary(private_cloud.affine.max_ram | human_to_bytes, 0)) +
        (private_cloud.stages.immich | ternary((private_cloud.immich.max_ram | human_to_bytes) + (private_cloud.immich.machine_learning_max_ram | human_to_bytes) + (private_cloud.immich.valkey_max_ram | human_to_bytes), 0)) +
        (private_cloud.stages.networking | ternary(939524096, 0)) +
        (private_cloud.stages.media | ternary(14629732352, 0)) +
        (private_cloud.stages.stalwart | ternary(private_cloud.stalwart.max_ram | human_to_bytes, 0)) +
        (private_cloud.stages.zabbix_server | ternary(1610612736, 0)) +
        (private_cloud.stages.logging | ternary((private_cloud.logging.openobserve_max_ram | human_to_bytes) + (private_cloud.logging.alloy_max_ram | human_to_bytes), 0))
      }}

- name: Require memory for workloads and host reserve
  ansible.builtin.assert:
    that:
      - (ansible_facts.memtotal_mb | int * 1048576) >= (preflight_host_reserve_bytes | int + preflight_workload_memory_bytes | int + preflight_transient_peak_bytes | int)
    fail_msg: >-
      Host RAM cannot cover enabled workload limits, the largest enabled transient Job or
      init-container limit, and the fixed 8GiB reserve for the operating system, k0s, and ZFS ARC.

- name: Calculate PostgreSQL derived memory value
  ansible.builtin.set_fact:
    private_cloud_shared_buffers: >-
      {{ ((private_cloud.postgres.max_ram[:-2] | int) * {'Ki': 1, 'Mi': 1024, 'Gi': 1048576, 'Ti': 1073741824}[private_cloud.postgres.max_ram[-2:]] // 4 // 1024) }}MB

- name: Require minimum PostgreSQL shared buffers
  ansible.builtin.assert:
    that:
      - private_cloud_shared_buffers[:-2] | int >= 128
    fail_msg: PostgreSQL max_ram must provide at least 128 MiB shared buffers

- name: Build sanitized installation summary
  ansible.builtin.set_fact:
    private_cloud_summary:
      stages: "{{ private_cloud.stages }}"
      disks: "{{ private_cloud.storage.disks }}"
