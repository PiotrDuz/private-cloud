        shared_buffers: "{{ private_cloud_shared_buffers }}"
      meilisearch: "{{ private_cloud.meilisearch }}"
      tika: "{{ private_cloud.tika }}"
      bleve: "{{ private_cloud.bleve }}"
      onlyoffice: "{{ private_cloud.onlyoffice }}"
      opencloud: "{{ private_cloud.opencloud }}"
      grist: "{{ private_cloud.grist }}"
      redis_affine: "{{ private_cloud.redis_affine }}"
      affine: "{{ private_cloud.affine }}"
      immich: "{{ private_cloud.immich }}"
      stalwart: "{{ private_cloud.stalwart }}"
      zabbix: "{{ private_cloud.zabbix }}"
      logging: "{{ private_cloud.logging }}"
      notifications: "{{ private_cloud.notifications }}"
      secrets:
        storage_encryption_passphrase: configured
        postgres_admin_password: configured
        meilisearch_master_key: configured
        onlyoffice_jwt_secret: configured
        opencloud_admin_password: configured
        grist_database_password: configured
        grist_session_secret: configured
        grist_boot_key: configured
        affine_database_password: configured
        immich_database_password: configured
        stalwart_database_password: configured
