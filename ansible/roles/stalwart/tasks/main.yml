---
- name: Validate Stalwart inputs
  ansible.builtin.assert:
    that:
      - private_cloud.stalwart.storage_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.stalwart.max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
      - stalwart_database_name is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - stalwart_database_username is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - private_cloud_secrets.stalwart.database_password | length > 0
      - private_cloud_secrets.stalwart.admin_password | length > 0
      - private_cloud_secrets.stalwart.mailbox_password | length > 0
      - private_cloud_secrets.stalwart.relay_password | length > 0
    fail_msg: Stalwart configuration is invalid.
  no_log: true

- name: Prepare the Stalwart kubeconfig
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/kubeconfig.yml"
  vars:
    private_cloud_kubeconfig: "{{ stalwart_kubeconfig }}"

- name: Resolve a Ready Kubernetes node
  kubernetes.core.k8s_info:
    kubeconfig: "{{ stalwart_kubeconfig }}"
    api_version: v1
    kind: Node
    name: "{{ ansible_hostname }}"
  register: stalwart_nodes
  changed_when: false

- name: Select the managed storage node
  ansible.builtin.set_fact:
    stalwart_node_name: "{{ ansible_hostname }}"

- name: Require the managed storage node to be Ready
  ansible.builtin.assert:
    that:
      - stalwart_nodes.resources | length == 1
      - stalwart_nodes.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0
    fail_msg: "Managed storage host {{ ansible_hostname }} is not a Ready Kubernetes node for Stalwart."

- name: Prepare the Stalwart service dataset
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/service_dataset.yml"
  vars:
    private_cloud_service_name: Stalwart
    private_cloud_service_dataset: "{{ stalwart_dataset }}"
    private_cloud_service_dataset_mountpoint: "{{ stalwart_dataset_mountpoint }}"
    private_cloud_service_storage_size: "{{ private_cloud.stalwart.storage_size }}"

- name: Prepare Stalwart dataset permissions
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/service_dataset_permissions.yml"
  vars:
    private_cloud_service_dataset_mountpoint: "{{ stalwart_dataset_mountpoint }}"
    private_cloud_service_dataset_owner: '2000'
    private_cloud_service_dataset_group: '2000'

- name: Verify the Stalwart service dataset quota
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/service_dataset_quota.yml"
  vars:
    private_cloud_service_name: Stalwart
    private_cloud_service_dataset: "{{ stalwart_dataset }}"
    private_cloud_service_storage_size: "{{ private_cloud.stalwart.storage_size }}"

- name: Inspect existing Stalwart storage and credentials
  kubernetes.core.k8s_info:
    kubeconfig: "{{ stalwart_kubeconfig }}"
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ item.namespace | default(omit) }}"
  loop:
    - {api_version: v1, kind: PersistentVolume, name: stalwart-data}
    - {api_version: v1, kind: PersistentVolumeClaim, name: stalwart-data, namespace: private-cloud}
    - {api_version: v1, kind: Secret, name: stalwart-runtime-credentials, namespace: private-cloud}
  register: stalwart_existing
  changed_when: false
  no_log: true

- name: Reject incompatible Stalwart persistent storage
  ansible.builtin.assert:
    that:
      - stalwart_existing.results[0].resources | length == 0 or stalwart_existing.results[0].resources[0].spec.local.path == stalwart_dataset_mountpoint
      - stalwart_existing.results[0].resources | length == 0 or stalwart_existing.results[0].resources[0].spec.capacity.storage == stalwart_pv_capacity
      - stalwart_existing.results[0].resources | length == 0 or stalwart_node_name in stalwart_existing.results[0].resources[0].spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values
      - stalwart_existing.results[1].resources | length == 0 or stalwart_existing.results[1].resources[0].spec.resources.requests.storage == stalwart_pv_capacity
      - stalwart_existing.results[1].resources | length == 0 or stalwart_existing.results[1].resources[0].spec.volumeName == stalwart_pv_name
    fail_msg: Existing Stalwart persistent storage conflicts with the configured local storage.

- name: Classify the existing Stalwart runtime credentials
  ansible.builtin.set_fact:
    stalwart_runtime_secret_present: "{{ stalwart_existing.results[2].resources | length > 0 }}"
    stalwart_runtime_secret_managed: >-
      {{ stalwart_existing.results[2].resources | length > 0 and
         ((stalwart_existing.results[2].resources[0].metadata.annotations | default({})).get('private-cloud.example/managed-by', '') == 'ansible') }}
    stalwart_database_password_matches: >-
      {{ stalwart_existing.results[2].resources | length > 0 and
         stalwart_existing.results[2].resources[0].data.STALWART_DB_PASSWORD is defined and
         (stalwart_existing.results[2].resources[0].data.STALWART_DB_PASSWORD | b64decode == private_cloud_secrets.stalwart.database_password) }}
    stalwart_relay_password_matches: >-
      {{ stalwart_existing.results[2].resources | length > 0 and
         stalwart_existing.results[2].resources[0].data.INBOX_EU_SMTP_PASSWORD is defined and
         (stalwart_existing.results[2].resources[0].data.INBOX_EU_SMTP_PASSWORD | b64decode == private_cloud_secrets.stalwart.relay_password) }}
  no_log: true

- name: Reject incompatible unmanaged Stalwart runtime credentials
  ansible.builtin.assert:
    that:
      - not stalwart_runtime_secret_present | bool or stalwart_runtime_secret_managed | bool or stalwart_database_password_matches | bool
      - not stalwart_runtime_secret_present | bool or stalwart_runtime_secret_managed | bool or stalwart_relay_password_matches | bool
    fail_msg: Existing Stalwart runtime credentials conflict with the configured credentials.
  no_log: true

- name: Locate PostgreSQL pod for Stalwart database bootstrap
  kubernetes.core.k8s_info:
    kubeconfig: "{{ stalwart_kubeconfig }}"
    api_version: v1
    kind: Pod
    namespace: "{{ stalwart_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=postgres
  register: stalwart_postgres_pods
  until:
    - stalwart_postgres_pods.resources | length > 0
    - stalwart_postgres_pods.resources[0].status.containerStatuses | default([]) | selectattr('ready', 'equalto', true) | list | length > 0
  retries: 60
  delay: 5
  changed_when: false

- name: Check Stalwart PostgreSQL login role
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ stalwart_kubeconfig }}"
    namespace: "{{ stalwart_namespace }}"
    pod: "{{ stalwart_postgres_pods.resources[0].metadata.name }}"
    command: >-
      psql -At -U postgres -d postgres -c
      "SELECT rolcanlogin FROM pg_roles WHERE rolname = '{{ stalwart_database_username | replace("'", "''") }}';"
  register: stalwart_role_exists
  changed_when: false
  no_log: true

- name: Create the Stalwart PostgreSQL login role
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ stalwart_kubeconfig }}"
    namespace: "{{ stalwart_namespace }}"
    pod: "{{ stalwart_postgres_pods.resources[0].metadata.name }}"
    command: >-
      sh -c 'printf %s {{ lookup('template', 'create-role.sql.j2') | b64encode }} |
      base64 -d | psql -v ON_ERROR_STOP=1 -At -U postgres -d postgres'
  when: stalwart_role_exists.stdout | trim == ''
  changed_when: true
  no_log: true

- name: Update the Stalwart PostgreSQL login role
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ stalwart_kubeconfig }}"
    namespace: "{{ stalwart_namespace }}"
    pod: "{{ stalwart_postgres_pods.resources[0].metadata.name }}"
    command: >-
      sh -c 'printf %s {{ lookup('template', 'alter-role.sql.j2') | b64encode }} |
      base64 -d | psql -v ON_ERROR_STOP=1 -At -U postgres -d postgres'
  when:
    - stalwart_role_exists.stdout | trim != ''
    - stalwart_role_exists.stdout | trim == 'f' or not stalwart_database_password_matches | bool
  changed_when: true
  no_log: true

- name: Check Stalwart PostgreSQL database
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ stalwart_kubeconfig }}"
    namespace: "{{ stalwart_namespace }}"
    pod: "{{ stalwart_postgres_pods.resources[0].metadata.name }}"
    command: >-
      psql -At -U postgres -d postgres -c
      "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = '{{ stalwart_database_name | replace("'", "''") }}';"
  register: stalwart_database_exists
  changed_when: false
  no_log: true

- name: Create Stalwart PostgreSQL database
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ stalwart_kubeconfig }}"
    namespace: "{{ stalwart_namespace }}"
    pod: "{{ stalwart_postgres_pods.resources[0].metadata.name }}"
    command: createdb -U postgres -O {{ stalwart_database_username }} {{ stalwart_database_name }}
  when: stalwart_database_exists.stdout | trim == ''
  changed_when: true
  no_log: true

- name: Set Stalwart database owner when needed
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ stalwart_kubeconfig }}"
    namespace: "{{ stalwart_namespace }}"
    pod: "{{ stalwart_postgres_pods.resources[0].metadata.name }}"
    command: >-
      psql -At -U postgres -d postgres -c
      "ALTER DATABASE \"{{ stalwart_database_name }}\" OWNER TO \"{{ stalwart_database_username }}\";"
  when:
    - stalwart_database_exists.stdout | trim != ''
    - stalwart_database_exists.stdout | trim != stalwart_database_username
  changed_when: true
  no_log: true

- name: Apply Stalwart runtime credentials
  kubernetes.core.k8s:
    kubeconfig: "{{ stalwart_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', 'runtime-secret.yml.j2') | from_yaml }}"
  no_log: true

- name: Calculate the Stalwart configuration revision
  ansible.builtin.set_fact:
    stalwart_configuration_revision: >-
      {{ (lookup('template', 'plan.ndjson.j2') ~ lookup('template', 'runtime-secret.yml.j2')) | hash('sha256') }}
  no_log: true

- name: Render Stalwart manifests from Jinja templates
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/render_manifests.yml"
  vars:
    manifest_service: stalwart
    manifest_template_dir: "{{ role_path }}/../../../k0s-services/stalwart/templates"

- name: Select Stalwart manifest stages
  ansible.builtin.set_fact:
    stalwart_storage_manifests: >-
      {{ private_cloud_rendered_manifests
         | selectattr('kind', 'in', ['PersistentVolume', 'PersistentVolumeClaim']) | list }}
    stalwart_service_manifests: >-
      {{ private_cloud_rendered_manifests
         | rejectattr('kind', 'in', ['PersistentVolume', 'PersistentVolumeClaim', 'StatefulSet', 'Job']) | list }}
    stalwart_statefulset_manifests: >-
      {{ private_cloud_rendered_manifests | selectattr('kind', 'equalto', 'StatefulSet') | list }}
    stalwart_job_manifests: >-
      {{ private_cloud_rendered_manifests | selectattr('kind', 'equalto', 'Job') | list }}

- name: Apply Stalwart storage and services
  kubernetes.core.k8s:
    kubeconfig: "{{ stalwart_kubeconfig }}"
    state: present
    definition: "{{ stalwart_storage_manifests + stalwart_service_manifests }}"
  no_log: true
- name: Inspect the applied Stalwart configuration revision
  kubernetes.core.k8s_info:
    kubeconfig: "{{ stalwart_kubeconfig }}"
    api_version: apps/v1
    kind: StatefulSet
    name: "{{ stalwart_service_name }}"
    namespace: "{{ stalwart_namespace }}"
  register: stalwart_existing_statefulset
  changed_when: false

- name: Determine whether Stalwart configuration must be applied
  ansible.builtin.set_fact:
    stalwart_configuration_required: >-
      {{ stalwart_existing_statefulset.resources | length == 0 or ((stalwart_existing_statefulset.resources[0].spec.template.metadata.annotations | default({})).get("private-cloud.example/configuration-revision", "") != stalwart_configuration_revision) }}


- name: Apply Stalwart configuration with temporary recovery access
  block:
    - name: Apply temporary Stalwart recovery credentials and configuration plan
      kubernetes.core.k8s:
        kubeconfig: "{{ stalwart_kubeconfig }}"
        state: present
        definition: "{{ lookup('template', item) | from_yaml }}"
      loop:
        - recovery-secret.yml.j2
        - plan-secret.yml.j2
      no_log: true

    - name: Apply Stalwart StatefulSet
      kubernetes.core.k8s:
        kubeconfig: "{{ stalwart_kubeconfig }}"
        state: present
        definition: "{{ stalwart_statefulset_manifests }}"
      no_log: true

    - name: Restart Stalwart with temporary recovery access
      kubernetes.core.k8s:
        kubeconfig: "{{ stalwart_kubeconfig }}"
        state: patched
        definition:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: "{{ stalwart_service_name }}"
            namespace: "{{ stalwart_namespace }}"
          spec:
            template:
              metadata:
                annotations:
                  private-cloud.example/recovery-revision: "{{ stalwart_configuration_revision }}"
      no_log: true

    - name: Wait for Stalwart recovery access
      kubernetes.core.k8s_info:
        kubeconfig: "{{ stalwart_kubeconfig }}"
        api_version: apps/v1
        kind: StatefulSet
        name: "{{ stalwart_service_name }}"
        namespace: "{{ stalwart_namespace }}"
      register: stalwart_statefulset
      until:
        - stalwart_statefulset.resources | length > 0
        - stalwart_statefulset.resources[0].status.observedGeneration | default(0) | int >= stalwart_statefulset.resources[0].metadata.generation | int
        - stalwart_statefulset.resources[0].status.updateRevision | default('') | length > 0
        - stalwart_statefulset.resources[0].status.currentRevision | default('') == stalwart_statefulset.resources[0].status.updateRevision
        - stalwart_statefulset.resources[0].status.updatedReplicas | default(0) | int == stalwart_statefulset.resources[0].spec.replicas | default(1) | int
        - stalwart_statefulset.resources[0].status.readyReplicas | default(0) | int == stalwart_statefulset.resources[0].spec.replicas | default(1) | int
      retries: 60
      delay: 5
      changed_when: false

    - name: Remove a completed Stalwart configuration job
      kubernetes.core.k8s:
        kubeconfig: "{{ stalwart_kubeconfig }}"
        state: absent
        api_version: batch/v1
        kind: Job
        name: "{{ stalwart_plan_job_name }}"
        namespace: "{{ stalwart_namespace }}"
        wait: true
      no_log: true

    - name: Apply Stalwart configuration job
      kubernetes.core.k8s:
        kubeconfig: "{{ stalwart_kubeconfig }}"
        state: present
        definition: "{{ stalwart_job_manifests }}"
      no_log: true

    - name: Wait for Stalwart configuration job
      kubernetes.core.k8s_info:
        kubeconfig: "{{ stalwart_kubeconfig }}"
        api_version: batch/v1
        kind: Job
        name: "{{ stalwart_plan_job_name }}"
        namespace: "{{ stalwart_namespace }}"
      register: stalwart_plan_job
      until:
        - stalwart_plan_job.resources | length > 0
        - stalwart_plan_job.resources[0].status.succeeded | default(0) | int == 1 or stalwart_plan_job.resources[0].status.failed | default(0) | int > 0
      retries: 60
      delay: 5
      changed_when: false
      failed_when: stalwart_plan_job.resources | length > 0 and stalwart_plan_job.resources[0].status.failed | default(0) | int > 0
  always:
    - name: Remove temporary Stalwart configuration resources
      kubernetes.core.k8s:
        kubeconfig: "{{ stalwart_kubeconfig }}"
        state: absent
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: "{{ stalwart_namespace }}"
        wait: true
      loop:
        - {api_version: batch/v1, kind: Job, name: stalwart-configure}
        - {api_version: v1, kind: Secret, name: stalwart-configuration-plan}
        - {api_version: v1, kind: Secret, name: stalwart-recovery-credentials}
      no_log: true

    - name: Restart Stalwart without recovery access after successful configuration
      kubernetes.core.k8s:
        kubeconfig: "{{ stalwart_kubeconfig }}"
        state: patched
        definition:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: "{{ stalwart_service_name }}"
            namespace: "{{ stalwart_namespace }}"
          spec:
            template:
              metadata:
                annotations:
                  private-cloud.example/recovery-revision: null
                  private-cloud.example/configuration-revision: "{{ stalwart_configuration_revision }}"
      when:
        - stalwart_plan_job is defined
        - stalwart_plan_job.resources | default([]) | length > 0
        - stalwart_plan_job.resources[0].status.succeeded | default(0) | int == 1
      no_log: true

    - name: Restart Stalwart without recovery access after failed configuration
      kubernetes.core.k8s:
        kubeconfig: "{{ stalwart_kubeconfig }}"
        state: patched
        definition:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: "{{ stalwart_service_name }}"
            namespace: "{{ stalwart_namespace }}"
          spec:
            template:
              metadata:
                annotations:
                  private-cloud.example/recovery-revision: null
      when: >-
        stalwart_plan_job is not defined or
        stalwart_plan_job.resources | default([]) | length == 0 or
        stalwart_plan_job.resources[0].status.succeeded | default(0) | int != 1
      no_log: true

    - name: Wait for Stalwart without recovery access
      kubernetes.core.k8s_info:
        kubeconfig: "{{ stalwart_kubeconfig }}"
        api_version: apps/v1
        kind: StatefulSet
        name: "{{ stalwart_service_name }}"
        namespace: "{{ stalwart_namespace }}"
      register: stalwart_final_statefulset
      until:
        - stalwart_final_statefulset.resources | length > 0
        - stalwart_final_statefulset.resources[0].status.observedGeneration | default(0) | int >= stalwart_final_statefulset.resources[0].metadata.generation | int
        - stalwart_final_statefulset.resources[0].status.updateRevision | default('') | length > 0
        - stalwart_final_statefulset.resources[0].status.currentRevision | default('') == stalwart_final_statefulset.resources[0].status.updateRevision
        - stalwart_final_statefulset.resources[0].status.updatedReplicas | default(0) | int == stalwart_final_statefulset.resources[0].spec.replicas | default(1) | int
        - stalwart_final_statefulset.resources[0].status.readyReplicas | default(0) | int == stalwart_final_statefulset.resources[0].spec.replicas | default(1) | int
      retries: 60
      delay: 5
      changed_when: false
  when: stalwart_configuration_required | bool

- name: Wait for Stalwart service endpoint
  kubernetes.core.k8s_info:
    kubeconfig: "{{ stalwart_kubeconfig }}"
    api_version: v1
    kind: Endpoints
    name: "{{ stalwart_endpoint_service_name }}"
    namespace: "{{ stalwart_namespace }}"
  register: stalwart_endpoint
  until: stalwart_endpoint.resources | length > 0 and (stalwart_endpoint.resources[0].subsets | default([]) | selectattr('addresses', 'defined') | list | length > 0)
  retries: 60
  delay: 5
  changed_when: false
