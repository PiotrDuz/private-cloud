stalwart_database_name: stalwart
stalwart_database_username: stalwart
stalwart_endpoint_service_name: stalwart
stalwart_runtime_secret_name: stalwart-runtime-credentials
stalwart_recovery_secret_name: stalwart-recovery-credentials
stalwart_plan_secret_name: stalwart-configuration-plan
stalwart_dataset: tank/secure/backup/k0s/services/stalwart
stalwart_dataset_mountpoint: /tank/secure/backup/k0s/services/stalwart
