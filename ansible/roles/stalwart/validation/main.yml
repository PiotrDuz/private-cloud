---
- name: Wait for Stalwart service endpoint
  kubernetes.core.k8s_info:
    kubeconfig: "{{ stalwart_kubeconfig }}"
    api_version: v1
    kind: Endpoints
    name: "{{ stalwart_endpoint_service_name }}"
    namespace: "{{ stalwart_namespace }}"
  register: stalwart_endpoint
  until: stalwart_endpoint.resources | length > 0 and (stalwart_endpoint.resources[0].subsets | default([]) | selectattr('addresses', 'defined') | list | length > 0)
  retries: 60
  delay: 5
  changed_when: false

- name: Validate authenticated Stalwart JMAP discovery
  ansible.builtin.command:
    argv: [python3, "{{ playbook_dir }}/validation/check_application.py"]
    stdin: >-
      {{ {
        'kubeconfig': stalwart_kubeconfig,
        'namespace': stalwart_namespace,
        'service': stalwart_service_name,
        'remote_port': 8080,
        'path': '/jmap/session',
        'headers': {'Authorization': 'Basic ' ~ ((private_cloud.stalwart.mailbox_username ~ '@' ~ private_cloud.stalwart.domain ~ ':' ~ private_cloud_secrets.stalwart.mailbox_password) | b64encode)},
        'json_keys': ['accounts', 'apiUrl', 'capabilities']
      } | to_json }}
  changed_when: false
  no_log: true

- name: Read the external inbox follower state
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ stalwart_kubeconfig }}"
    namespace: "{{ stalwart_namespace }}"
    pod: stalwart-0
    container: imap-fetch
    command: cat {{ stalwart_imap_fetch_state_path }}
  register: stalwart_validation_imap_fetch
  until: stalwart_validation_imap_fetch.rc | default(1) == 0
  retries: 12
  delay: 10
  changed_when: false

# The follower rewrites its state after every IDLE cycle, so a stale timestamp means it cannot reach the provider.
- name: Require the external inbox follower to be connected
  ansible.builtin.assert:
    that:
      - (stalwart_validation_imap_fetch.stdout | from_json).uidvalidity is integer
      - (stalwart_validation_imap_fetch.stdout | from_json).last_uid is integer
      - (now(utc=true).timestamp() | int) - (stalwart_validation_imap_fetch.stdout | from_json).checked < 900
    fail_msg: The IMAP follower has not checked the external inbox in the last 15 minutes.

- name: Read the Stalwart search key
  kubernetes.core.k8s_info:
    kubeconfig: "{{ stalwart_kubeconfig }}"
    api_version: v1
    kind: Secret
    name: "{{ stalwart_runtime_secret_name }}"
    namespace: "{{ stalwart_namespace }}"
  register: stalwart_runtime_secret
  changed_when: false
  no_log: true

- name: Validate the scoped Stalwart search key reaches only its indexes
  ansible.builtin.command:
    argv: [python3, "{{ playbook_dir }}/validation/check_application.py"]
    stdin: >-
      {{ {
        'kubeconfig': stalwart_kubeconfig,
        'namespace': stalwart_namespace,
        'service': stalwart_meilisearch_service,
        'remote_port': stalwart_meilisearch_port,
        'path': item.path,
        'headers': {'Authorization': 'Bearer ' ~ (stalwart_runtime_secret.resources[0].data.STALWART_MEILISEARCH_API_KEY | b64decode)},
        'status_codes': [item.status]
      } | to_json }}
  loop:
    - {path: '/indexes?limit=1', status: 200}
    - {path: '/keys', status: 403}
  changed_when: false
  no_log: true
