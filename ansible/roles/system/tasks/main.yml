---
- name: Read active swap devices
  ansible.builtin.slurp:
    src: /proc/swaps
  register: system_active_swaps

- name: Prevent boot-time swap activation from fstab, GPT, and zram units
  ansible.builtin.systemd_service:
    name: swap.target
    masked: true

- name: Remove zram swap packages
  ansible.builtin.apt:
    name:
      - systemd-zram-generator
      - zram-config
      - zram-tools
    state: absent
    purge: true

- name: Remove SAN multipath packages
  ansible.builtin.apt:
    name:
      # The host has no SAN; sg3 udev rules warn about the USB boot disk on every SMART read.
      - multipath-tools
      - sg3-utils-udev
    state: absent
    purge: true

- name: Turn off unattended package upgrades
  ansible.builtin.copy:
    src: 99private-cloud-manual-upgrades
    dest: /etc/apt/apt.conf.d/99private-cloud-manual-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Mask the unattended upgrade units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    masked: true
  loop: [apt-daily-upgrade.timer, apt-daily-upgrade.service, unattended-upgrades.service]

- name: Find snapd
  ansible.builtin.stat:
    path: /usr/bin/snap
  register: system_snap

- name: Read the snap refresh hold
  ansible.builtin.command: snap get system refresh.hold
  register: system_snap_hold
  changed_when: false
  failed_when: false
  when: system_snap.stat.exists

- name: Hold snap auto-refresh indefinitely
  ansible.builtin.command: snap set system refresh.hold=forever
  when: system_snap.stat.exists and system_snap_hold.stdout | trim != 'forever'

- name: Remove swap entries from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\s*[^#\s]+\s+\S+\s+swap\s'
    state: absent

- name: Disable active swap
  ansible.builtin.command: swapoff --all
  when: (system_active_swaps.content | b64decode).splitlines() | length > 1

- name: Delete disabled swap files
  ansible.builtin.file:
    path: "{{ item.split()[0] }}"
    state: absent
  loop: "{{ (system_active_swaps.content | b64decode).splitlines()[1:] }}"
  when: item.split()[1] == 'file'

- name: Validate host system configuration
  ansible.builtin.include_tasks: ../validation/main.yml
