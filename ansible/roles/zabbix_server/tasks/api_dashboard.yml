- name: Configure the managed dashboard
  ansible.builtin.command:
    argv: [python3, "{{ playbook_dir }}/../zabbix/configure_dashboards.py"]
    stdin: >-
      {{ {
        'url': zabbix_api_url, 'token': zabbix_api_token,
        'host_id': zabbix_host_id, 'host': private_cloud_zabbix_hostname,
        'group_id': zabbix_group_id, 'dashboard': zabbix_dashboard_name,
        'datasets': private_cloud_monitored_dataset_names,
        'pool': zabbix_pool_name, 'interface': private_cloud.networking.lan.interface,
        'health': private_cloud.stages.zabbix_agent,
        'alloy': private_cloud.stages.logging and private_cloud.stages.zabbix_agent
      } | to_json }}
  register: zabbix_dashboard_apply
  changed_when: (zabbix_dashboard_apply.stdout | from_json).changed
  no_log: true

- name: Log out of the Zabbix API
  ansible.builtin.uri:
    url: "{{ zabbix_api_url }}"
    method: POST
    body_format: json
    headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
    body: {jsonrpc: '2.0', method: user.logout, params: {}, id: 20}
    status_code: 200
  register: zabbix_logout
  changed_when: false
  no_log: true
  failed_when: zabbix_logout.json.error is defined or zabbix_logout.json.result is not defined
