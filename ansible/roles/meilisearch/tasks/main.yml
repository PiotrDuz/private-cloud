---
- name: Validate Meilisearch inputs
  ansible.builtin.assert:
    that:
      - private_cloud.meilisearch.storage_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.meilisearch.max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
      - private_cloud_secrets.meilisearch.master_key | length >= 16
    fail_msg: Meilisearch configuration is invalid.
  no_log: true

- name: Prepare the Meilisearch kubeconfig
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/kubeconfig.yml"
  vars:
    private_cloud_kubeconfig: "{{ meilisearch_kubeconfig }}"

- name: Resolve a Ready Kubernetes node
  kubernetes.core.k8s_info:
    kubeconfig: "{{ meilisearch_kubeconfig }}"
    api_version: v1
    kind: Node
    name: "{{ ansible_hostname }}"
  register: meilisearch_nodes
  changed_when: false

- name: Select the managed storage node
  ansible.builtin.set_fact:
    meilisearch_node_name: "{{ ansible_hostname }}"

- name: Require the managed storage node to be Ready
  ansible.builtin.assert:
    that:
      - meilisearch_nodes.resources | length == 1
      - meilisearch_nodes.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0
    fail_msg: "Managed storage host {{ ansible_hostname }} is not a Ready Kubernetes node for Meilisearch."

- name: Prepare the Meilisearch service dataset
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/service_dataset.yml"
  vars:
    private_cloud_service_name: Meilisearch
    private_cloud_service_dataset: "{{ meilisearch_dataset }}"
    private_cloud_service_dataset_mountpoint: "{{ meilisearch_dataset_mountpoint }}"
    private_cloud_service_storage_size: "{{ private_cloud.meilisearch.storage_size }}"

- name: Verify the Meilisearch service dataset quota
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/service_dataset_quota.yml"
  vars:
    private_cloud_service_name: Meilisearch
    private_cloud_service_dataset: "{{ meilisearch_dataset }}"
    private_cloud_service_storage_size: "{{ private_cloud.meilisearch.storage_size }}"

- name: Inspect existing Meilisearch storage and credentials
  kubernetes.core.k8s_info:
    kubeconfig: "{{ meilisearch_kubeconfig }}"
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ item.namespace | default(omit) }}"
  loop:
    - {api_version: v1, kind: PersistentVolume, name: meilisearch-data}
    - {api_version: v1, kind: PersistentVolumeClaim, name: meilisearch-data, namespace: private-cloud}
    - {api_version: v1, kind: Secret, name: meilisearch-credentials, namespace: private-cloud}
  register: meilisearch_existing
  changed_when: false
  no_log: true

- name: Reject incompatible Meilisearch persistent storage
  ansible.builtin.assert:
    that:
      - meilisearch_existing.results[0].resources | length == 0 or meilisearch_existing.results[0].resources[0].spec.local.path == meilisearch_dataset_mountpoint
      - meilisearch_existing.results[0].resources | length == 0 or meilisearch_existing.results[0].resources[0].spec.capacity.storage == meilisearch_pv_capacity
      - meilisearch_existing.results[0].resources | length == 0 or meilisearch_node_name in meilisearch_existing.results[0].resources[0].spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values
      - meilisearch_existing.results[1].resources | length == 0 or meilisearch_existing.results[1].resources[0].spec.resources.requests.storage == meilisearch_pv_capacity
      - meilisearch_existing.results[1].resources | length == 0 or meilisearch_existing.results[1].resources[0].spec.volumeName == meilisearch_pv_name
    fail_msg: Existing Meilisearch persistent storage conflicts with the configured local storage.

- name: Classify the existing Meilisearch credentials
  ansible.builtin.set_fact:
    meilisearch_secret_present: "{{ meilisearch_existing.results[2].resources | length > 0 }}"
    meilisearch_secret_managed: >-
      {{ meilisearch_existing.results[2].resources | length > 0 and
         ((meilisearch_existing.results[2].resources[0].metadata.annotations | default({})).get('private-cloud.example/managed-by', '') == 'ansible') }}
    meilisearch_secret_matches: >-
      {{ meilisearch_existing.results[2].resources | length > 0 and
         meilisearch_existing.results[2].resources[0].data.MEILI_MASTER_KEY is defined and
         (meilisearch_existing.results[2].resources[0].data.MEILI_MASTER_KEY | b64decode == private_cloud_secrets.meilisearch.master_key) }}
  no_log: true

- name: Reject incompatible unmanaged Meilisearch credentials
  ansible.builtin.assert:
    that: not meilisearch_secret_present | bool or meilisearch_secret_matches | bool or meilisearch_secret_managed | bool
    fail_msg: Existing Meilisearch credentials conflict with the configured master key.
  no_log: true

- name: Apply Meilisearch credentials
  kubernetes.core.k8s:
    kubeconfig: "{{ meilisearch_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', 'secret.yml.j2') | from_yaml }}"
  register: meilisearch_secret_apply
  when: not meilisearch_secret_present | bool or not meilisearch_secret_matches | bool
  no_log: true

- name: Render Meilisearch manifests from Jinja templates
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/render_manifests.yml"
  vars:
    manifest_service: meilisearch
    manifest_template_dir: "{{ role_path }}/../../../k0s-services/meilisearch/templates"

- name: Select Meilisearch manifest stages
  ansible.builtin.set_fact:
    meilisearch_storage_manifests: >-
      {{ private_cloud_rendered_manifests
         | selectattr("kind", "in", ["PersistentVolume", "PersistentVolumeClaim"]) | list }}
    meilisearch_workload_manifests: >-
      {{ private_cloud_rendered_manifests
         | rejectattr("kind", "in", ["PersistentVolume", "PersistentVolumeClaim"]) | list }}

- name: Apply Meilisearch storage
  kubernetes.core.k8s:
    kubeconfig: "{{ meilisearch_kubeconfig }}"
    state: present
    definition: "{{ meilisearch_storage_manifests }}"

- name: Apply Meilisearch workload
  kubernetes.core.k8s:
    kubeconfig: "{{ meilisearch_kubeconfig }}"
    state: present
    definition: "{{ meilisearch_workload_manifests }}"

- name: Restart Meilisearch after a credentials change
  kubernetes.core.k8s:
    kubeconfig: "{{ meilisearch_kubeconfig }}"
    state: patched
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ meilisearch_service_name }}"
        namespace: "{{ meilisearch_namespace }}"
      spec:
        template:
          metadata:
            annotations:
              private-cloud.example/credentials-restarted-at: "{{ ansible_date_time.iso8601 }}"
  when: meilisearch_secret_apply.changed | default(false)
  no_log: true

- name: Wait for Meilisearch deployment
  kubernetes.core.k8s_info:
    kubeconfig: "{{ meilisearch_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    name: "{{ meilisearch_service_name }}"
    namespace: "{{ meilisearch_namespace }}"
  register: meilisearch_deployment
  until:
    - meilisearch_deployment.resources | length > 0
    - meilisearch_deployment.resources[0].status.observedGeneration | default(0) | int >= meilisearch_deployment.resources[0].metadata.generation | int
    - meilisearch_deployment.resources[0].status.updatedReplicas | default(0) | int == meilisearch_deployment.resources[0].spec.replicas | default(1) | int
    - meilisearch_deployment.resources[0].status.readyReplicas | default(0) | int == meilisearch_deployment.resources[0].spec.replicas | default(1) | int
    - meilisearch_deployment.resources[0].status.availableReplicas | default(0) | int == meilisearch_deployment.resources[0].spec.replicas | default(1) | int
  retries: 60
  delay: 5
  changed_when: false

- name: Wait for Meilisearch service endpoint
  kubernetes.core.k8s_info:
    kubeconfig: "{{ meilisearch_kubeconfig }}"
    api_version: v1
    kind: Endpoints
    name: "{{ meilisearch_service_name }}"
    namespace: "{{ meilisearch_namespace }}"
  register: meilisearch_endpoint
  until: meilisearch_endpoint.resources | length > 0 and (meilisearch_endpoint.resources[0].subsets | default([]) | selectattr('addresses', 'defined') | list | length > 0)
  retries: 60
  delay: 5
  changed_when: false
