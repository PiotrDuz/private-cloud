---
- name: Require the private cloud host firewall to be active
  ansible.builtin.command: systemctl is-active private-cloud-firewall.service
  register: networking_validation_firewall
  changed_when: false
  failed_when: networking_validation_firewall.stdout | trim != 'active'

- name: Read the active private cloud firewall table
  ansible.builtin.command:
    argv: [nft, list, table, inet, private_cloud]
  register: networking_validation_firewall_rules
  changed_when: false

- name: Verify public service and local administration firewall paths
  ansible.builtin.assert:
    that:
      - networking_validation_firewall_rules.stdout is search('tcp dport \{ 25, 443 \}')
      - networking_validation_firewall_rules.stdout is search('udp dport ' ~ (private_cloud.networking.amneziawg.listen_port | string))
      - networking_validation_firewall_rules.stdout is search('iifname "lo" accept')
    fail_msg: The active firewall does not expose the configured service ports or preserve local host traffic.

- name: Verify that unknown interfaces are dropped
  ansible.builtin.assert:
    that:
      - networking_validation_firewall_rules.stdout is search('iifname "veth\*" accept')
      - networking_validation_firewall_rules.stdout is search('iifname != \{[^}]*"kube-bridge"[^}]*\} drop')
    fail_msg: The active firewall accepts traffic from interfaces other than loopback, the default interface, and pod networking.

- name: Wait for Traefik and AmneziaWG rollouts
  ansible.builtin.command:
    argv:
      - k0s
      - kubectl
      - rollout
      - status
      - deployment/{{ item.name }}
      - -n
      - "{{ item.namespace }}"
      - --timeout=120s
  loop:
    - {name: traefik, namespace: edge}
    - {name: amneziawg, namespace: network-access}
  changed_when: false

- name: Read the Traefik service endpoint
  kubernetes.core.k8s_info:
    kubeconfig: "{{ networking_kubeconfig }}"
    api_version: v1
    kind: Endpoints
    namespace: edge
    name: traefik
  register: networking_validation_traefik_endpoint
  changed_when: false

- name: Require a ready Traefik service endpoint
  ansible.builtin.assert:
    that:
      - networking_validation_traefik_endpoint.resources | length == 1
      - networking_validation_traefik_endpoint.resources[0].subsets | default([]) | selectattr('addresses', 'defined') | list | length > 0
    fail_msg: Traefik has no ready service endpoint.

- name: Read cluster RBAC bindings
  kubernetes.core.k8s_info:
    kubeconfig: "{{ networking_kubeconfig }}"
    api_version: rbac.authorization.k8s.io/v1
    kind: "{{ item }}"
  loop: [ClusterRoleBinding, RoleBinding]
  register: networking_validation_bindings
  changed_when: false
  no_log: true

- name: Require that no RBAC binding references the Traefik ServiceAccount
  ansible.builtin.assert:
    that: >-
      networking_validation_bindings.results | map(attribute='resources') | flatten
      | selectattr('subjects', 'defined') | map(attribute='subjects') | flatten
      | selectattr('kind', 'equalto', 'ServiceAccount') | selectattr('name', 'equalto', 'traefik')
      | selectattr('namespace', 'equalto', 'edge') | list | length == 0
    fail_msg: Traefik's ServiceAccount must have no Kubernetes API permissions.

- name: Read the Traefik pod
  kubernetes.core.k8s_info:
    kubeconfig: "{{ networking_kubeconfig }}"
    api_version: v1
    kind: Pod
    namespace: edge
    label_selectors:
      - app.kubernetes.io/name=traefik
  register: networking_validation_traefik_pods
  changed_when: false

- name: Require a Traefik pod without a service-account token
  ansible.builtin.assert:
    that:
      - networking_validation_traefik_pods.resources | length > 0
      - networking_validation_traefik_pods.resources | map(attribute='spec.volumes') | flatten | selectattr('name', 'match', '^kube-api-access-') | list | length == 0
      - networking_validation_traefik_pods.resources | map(attribute='spec.automountServiceAccountToken') | unique | list == [false]
    fail_msg: The Traefik pod has a Kubernetes API credential.

- name: Read Traefik's egress NetworkPolicy
  kubernetes.core.k8s_info:
    kubeconfig: "{{ networking_kubeconfig }}"
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    namespace: edge
    name: traefik
  register: networking_validation_traefik_networkpolicy
  changed_when: false

- name: Require Traefik's egress NetworkPolicy
  ansible.builtin.assert:
    that: networking_validation_traefik_networkpolicy.resources | length == 1
    fail_msg: Traefik's egress NetworkPolicy is missing.

- name: Verify AmneziaWG enables forwarding in its isolated network namespace
  ansible.builtin.command:
    argv: [k0s, kubectl, exec, -n, network-access, deployment/amneziawg, --, cat, /proc/sys/net/ipv4/ip_forward]
  register: networking_validation_amneziawg_forwarding
  changed_when: false

- name: Require AmneziaWG forwarding enabled
  ansible.builtin.assert:
    that: networking_validation_amneziawg_forwarding.stdout | trim == '1'
    fail_msg: AmneziaWG's network namespace is not forwarding peer traffic.

- name: Read AmneziaWG's egress NetworkPolicy
  kubernetes.core.k8s_info:
    kubeconfig: "{{ networking_kubeconfig }}"
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    namespace: network-access
    name: amneziawg
  register: networking_validation_amneziawg_networkpolicy
  changed_when: false

- name: Require the AmneziaWG egress NetworkPolicy
  ansible.builtin.assert:
    that: networking_validation_amneziawg_networkpolicy.resources | length == 1
    fail_msg: AmneziaWG's egress NetworkPolicy is missing.

- name: Define the exact Traefik endpoint selectors expected for AmneziaWG
  ansible.builtin.set_fact:
    networking_validation_amneziawg_traefik_egress_to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: edge
        podSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
    networking_validation_amneziawg_traefik_egress_ports:
      - protocol: TCP
        port: 8443
  changed_when: false

- name: Match the exact AmneziaWG HTTPS egress rule
  ansible.builtin.set_fact:
    networking_validation_amneziawg_traefik_egress_rules: >-
      {{ networking_validation_amneziawg_networkpolicy.resources[0].spec.egress
      | selectattr('to', 'equalto', networking_validation_amneziawg_traefik_egress_to)
      | selectattr('ports', 'equalto', networking_validation_amneziawg_traefik_egress_ports)
      | list }}
  changed_when: false

- name: Require AmneziaWG HTTPS egress to Traefik's pod port
  ansible.builtin.assert:
    that: networking_validation_amneziawg_traefik_egress_rules | length == 1
    fail_msg: AmneziaWG peers cannot reach Traefik's HTTPS pod endpoint through hostPort DNAT.

- name: Read the Cloudflare DDNS CronJob
  kubernetes.core.k8s_info:
    kubeconfig: "{{ networking_kubeconfig }}"
    api_version: batch/v1
    kind: CronJob
    namespace: dns-system
    name: cloudflare-ddns
  register: networking_validation_ddns
  changed_when: false

- name: Require the configured Cloudflare DDNS job
  ansible.builtin.assert:
    that:
      - networking_validation_ddns.resources | length == 1
      - networking_validation_ddns.resources[0].spec.jobTemplate.spec.template.spec.containers | selectattr('name', 'equalto', 'updater') | list | length == 1
    fail_msg: The configured Cloudflare DDNS job is missing its updater container.

- name: Read the Cloudflare DDNS source configuration
  kubernetes.core.k8s_info:
    kubeconfig: "{{ networking_kubeconfig }}"
    api_version: v1
    kind: ConfigMap
    namespace: dns-system
    name: cloudflare-ddns
  register: networking_validation_ddns_config
  changed_when: false

- name: Require Cloudflare DDNS to use the production Cloudflare API
  ansible.builtin.assert:
    that:
      - networking_validation_ddns_config.resources | length == 1
      - ("ADDRESS_URL = " ~ (private_cloud.networking.public_ip_url | to_json)) in networking_validation_ddns_config.resources[0].data['update.py']
      - ('API_ROOT = "https://api.cloudflare.com/client/v4"') in networking_validation_ddns_config.resources[0].data['update.py']
    fail_msg: Cloudflare DDNS does not use the production Cloudflare API.

- name: Read the Traefik deployment
  kubernetes.core.k8s_info:
    kubeconfig: "{{ networking_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    namespace: edge
    name: traefik
  register: networking_validation_traefik
  changed_when: false

- name: Require Traefik to use the production ACME and Cloudflare endpoints
  ansible.builtin.assert:
    that:
      - networking_validation_traefik.resources | length == 1
      - (networking_validation_traefik.resources[0].spec.template.spec.containers | selectattr('name', 'equalto', 'traefik') | map(attribute='args') | first | select('search', 'acme[.]caserver') | list) == []
      - (networking_validation_traefik.resources[0].spec.template.spec.containers | selectattr('name', 'equalto', 'traefik') | map(attribute='env') | first | map(attribute='name') | select('search', '^CLOUDFLARE_BASE_URL$|^CF_API_URL$|^LEGO_CA') | list) == []
    fail_msg: Traefik overrides the production Let's Encrypt or Cloudflare endpoint.

- name: Require Traefik to use only the file provider
  ansible.builtin.assert:
    that:
      - networking_validation_traefik.resources[0].spec.template.spec.containers | selectattr('name', 'equalto', 'traefik') | map(attribute='args') | first | select('search', '^--providers[.]kubernetes') | list == []
      - '"--providers.file.directory=/etc/traefik/dynamic" in (networking_validation_traefik.resources[0].spec.template.spec.containers | selectattr("name", "equalto", "traefik") | map(attribute="args") | first)'
      - networking_validation_traefik.resources[0].spec.template.spec.volumes | selectattr('name', 'equalto', 'dynamic') | map(attribute='projected.sources') | flatten | selectattr('configMap.name', 'equalto', 'traefik-dynamic') | list | length == 1
    fail_msg: Traefik must read routes only from the file provider directory.

- name: Require Traefik's explicit public ACME resolvers and revision annotation
  ansible.builtin.assert:
    that:
      - >-
        '--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53'
        in (networking_validation_traefik.resources[0].spec.template.spec.containers | selectattr('name', 'equalto', 'traefik') | map(attribute='args') | first)
      - networking_validation_traefik.resources[0].spec.template.metadata.annotations['private-cloud.example/cloudflare-secret-revision'] | length > 0
    fail_msg: Traefik's Cloudflare DNS challenge or Secret revision annotation is missing.

- name: Require Traefik egress to public DNS for ACME propagation checks
  ansible.builtin.assert:
    that:
      - >-
        networking_validation_traefik_networkpolicy.resources[0].spec.egress
        | selectattr('ports.0.port', 'equalto', 53) | map(attribute='to') | flatten
        | selectattr('ipBlock', 'defined') | list | length == 1
    fail_msg: Traefik cannot reach public authoritative nameservers on port 53.

- name: Read the application Traefik egress NetworkPolicy
  kubernetes.core.k8s_info:
    kubeconfig: "{{ networking_kubeconfig }}"
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    namespace: private-cloud
    name: application-traefik-egress
  register: networking_validation_application_traefik_egress
  changed_when: false

- name: Require application egress to Traefik's pod port
  ansible.builtin.assert:
    that:
      - networking_validation_application_traefik_egress.resources | length == 1
      - networking_validation_application_traefik_egress.resources[0].spec.egress | length == 1
      - networking_validation_application_traefik_egress.resources[0].spec.egress[0].to == networking_validation_amneziawg_traefik_egress_to
      - networking_validation_application_traefik_egress.resources[0].spec.egress[0].ports == networking_validation_amneziawg_traefik_egress_ports
    fail_msg: Applications cannot reach Traefik's HTTPS pod endpoint through hostPort DNAT.

- name: Read the Traefik dynamic configuration
  kubernetes.core.k8s_info:
    kubeconfig: "{{ networking_kubeconfig }}"
    api_version: v1
    kind: ConfigMap
    namespace: edge
    name: traefik-dynamic
  register: networking_validation_traefik_dynamic
  changed_when: false

- name: Require the Traefik header and forward-auth middlewares
  ansible.builtin.assert:
    that:
      - networking_validation_traefik_dynamic.resources | length == 1
      - (networking_validation_traefik_dynamic.resources[0].data['tcp.yaml'] | from_yaml).http.middlewares.keys() | list | sort == ['forward-auth', 'strip-forwarded', 'strip-identity-headers']
      - (networking_validation_traefik_dynamic.resources[0].data['tcp.yaml'] | from_yaml).http.routers is not defined
    fail_msg: Traefik's dynamic configuration does not define the expected middlewares.

- name: Read the forward-auth helper resources
  kubernetes.core.k8s_info:
    kubeconfig: "{{ networking_kubeconfig }}"
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: edge
    name: "{{ item.name }}"
  loop:
    - {api_version: apps/v1, kind: Deployment, name: forward-auth}
    - {api_version: v1, kind: Secret, name: forward-auth}
    - {api_version: networking.k8s.io/v1, kind: NetworkPolicy, name: forward-auth}
  register: networking_validation_forward_auth
  changed_when: false
  when: private_cloud.stages.grist | bool
  no_log: true

- name: Require the oauth2-proxy helper, forward-auth middleware, and credential rollout
  vars:
    networking_validation_forward_auth_dynamic: "{{ networking_validation_traefik_dynamic.resources[0].data['tcp.yaml'] | from_yaml }}"
    networking_validation_forward_auth_pod: "{{ networking_validation_forward_auth.results[0].resources[0].spec.template }}"
  ansible.builtin.assert:
    that:
      - networking_validation_forward_auth.results | map(attribute='resources') | map('length') | select('equalto', 1) | list | length == 3
      - networking_validation_forward_auth_pod.spec.containers[0].image == networking_forward_auth_image
      - networking_validation_forward_auth_pod.metadata.annotations['private-cloud.example/secret-revision'] == networking_validation_forward_auth.results[1].resources[0].metadata.resourceVersion
      - networking_validation_forward_auth_dynamic.http.middlewares['forward-auth'].forwardAuth.address == 'http://forward-auth.edge.svc.cluster.local:4180/'
      - networking_validation_forward_auth_dynamic.http.middlewares['forward-auth'].forwardAuth.authResponseHeaders == ['X-Forwarded-User']
      - networking_validation_forward_auth.results[2].resources[0].spec.egress | map(attribute='ports') | flatten | selectattr('port', 'equalto', 8443) | list | length == 1
    fail_msg: The oauth2-proxy helper, its forward-auth middleware, its Traefik egress, or its credential rollout revision are not as configured.
  when: private_cloud.stages.grist | bool
  no_log: true
