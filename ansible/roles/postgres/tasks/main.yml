---
- name: Validate PostgreSQL inputs
  ansible.builtin.assert:
    that:
      - private_cloud.postgres.volume_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.postgres.max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
      - private_cloud_secrets.postgres.admin_password | length > 0
    fail_msg: PostgreSQL volume, memory, and administrator password are required.
  no_log: true

- name: Calculate PostgreSQL shared buffers
  ansible.builtin.set_fact:
    postgres_shared_buffers_bytes: "{{ (((private_cloud.postgres.max_ram | human_to_bytes) / 4) | int) }}"
    postgres_shared_buffers: "{{ ((((private_cloud.postgres.max_ram | human_to_bytes) / 4) / 1048576) | int) }}MB"

- name: Validate PostgreSQL shared buffers minimum
  ansible.builtin.assert:
    that: postgres_shared_buffers_bytes | int >= 134217728
    fail_msg: PostgreSQL max_ram must provide at least 128MiB shared_buffers.

- name: Prepare the PostgreSQL kubeconfig
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/kubeconfig.yml"
  vars:
    private_cloud_kubeconfig: "{{ postgres_kubeconfig }}"

- name: Create the PostgreSQL service dataset when needed
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/service_dataset_create.yml"
  vars:
    private_cloud_service_name: PostgreSQL
    private_cloud_service_dataset: "{{ postgres_dataset }}"
    private_cloud_service_storage_size: "{{ private_cloud.postgres.volume_size }}"
    private_cloud_service_capacity_label: volume_size

- name: Read PostgreSQL dataset tuning
  ansible.builtin.command: zfs get -H -o value {{ item.key }} {{ postgres_dataset }}
  loop: "{{ postgres_zfs_properties | dict2items }}"
  register: postgres_zfs_current
  changed_when: false

- name: Apply PostgreSQL dataset tuning
  ansible.builtin.command: zfs set {{ item.item.key }}={{ item.item.value }} {{ postgres_dataset }}
  loop: "{{ postgres_zfs_current.results }}"
  when: item.stdout | trim != item.item.value
  changed_when: true

- name: Read PostgreSQL dataset quota and reservation
  ansible.builtin.command: zfs get -H -p -o value {{ item }} {{ postgres_dataset }}
  loop:
    - quota
    - reservation
  register: postgres_capacity_current
  changed_when: false

- name: Apply PostgreSQL dataset quota and reservation
  ansible.builtin.command: zfs set {{ item.item }}={{ private_cloud.postgres.volume_size }} {{ postgres_dataset }}
  loop: "{{ postgres_capacity_current.results }}"
  when: item.stdout | int != (private_cloud.postgres.volume_size | human_to_bytes | int)
  changed_when: true

- name: Verify PostgreSQL dataset is mounted
  ansible.builtin.command: mountpoint -q {{ postgres_dataset_mountpoint }}
  changed_when: false

- name: Resolve a Ready Kubernetes node
  kubernetes.core.k8s_info:
    kubeconfig: "{{ postgres_kubeconfig }}"
    api_version: v1
    kind: Node
    name: "{{ ansible_hostname }}"
  register: postgres_nodes
  changed_when: false

- name: Select the managed storage node
  ansible.builtin.set_fact:
    postgres_node_name: "{{ ansible_hostname }}"

- name: Require the managed storage node to be Ready
  ansible.builtin.assert:
    that:
      - postgres_nodes.resources | length == 1
      - postgres_nodes.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0
    fail_msg: "Managed storage host {{ ansible_hostname }} is not a Ready Kubernetes node for PostgreSQL."

- name: Inspect existing PostgreSQL resources
  kubernetes.core.k8s_info:
    kubeconfig: "{{ postgres_kubeconfig }}"
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ item.namespace | default(omit) }}"
  loop:
    - {api_version: v1, kind: PersistentVolume, name: postgres-local-pv}
    - {api_version: v1, kind: PersistentVolumeClaim, name: postgres-data, namespace: private-cloud}
    - {api_version: v1, kind: Secret, name: postgres-admin-credentials, namespace: private-cloud}
  register: postgres_existing
  changed_when: false
  no_log: true

- name: Reject incompatible PostgreSQL persistent volume
  ansible.builtin.assert:
    that:
      - postgres_existing.results[0].resources | length == 0 or postgres_existing.results[0].resources[0].spec.local.path == postgres_dataset_mountpoint
      - postgres_existing.results[0].resources | length == 0 or postgres_existing.results[0].resources[0].spec.capacity.storage == postgres_pv_capacity
      - postgres_existing.results[0].resources | length == 0 or postgres_node_name in postgres_existing.results[0].resources[0].spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values
    fail_msg: Existing PostgreSQL PersistentVolume conflicts with the configured local storage.

- name: Reject incompatible PostgreSQL persistent volume claim
  ansible.builtin.assert:
    that:
      - postgres_existing.results[1].resources | length == 0 or postgres_existing.results[1].resources[0].spec.resources.requests.storage == postgres_pv_capacity
      - postgres_existing.results[1].resources | length == 0 or postgres_existing.results[1].resources[0].spec.volumeName == postgres_pv_name
    fail_msg: Existing PostgreSQL PersistentVolumeClaim conflicts with the fixed 10Ti volume.

- name: Reject incompatible PostgreSQL credentials secret
  ansible.builtin.assert:
    that:
      - postgres_existing.results[2].resources | length == 0 or postgres_existing.results[2].resources[0].data.POSTGRES_DB | b64decode == postgres_admin_database
      - postgres_existing.results[2].resources | length == 0 or postgres_existing.results[2].resources[0].data.POSTGRES_USER | b64decode == postgres_admin_username
      - postgres_existing.results[2].resources | length == 0 or postgres_existing.results[2].resources[0].data.POSTGRES_PASSWORD | b64decode == private_cloud_secrets.postgres.admin_password
    fail_msg: Existing PostgreSQL credentials secret conflicts with the configured credentials.
  no_log: true

- name: Find an existing PostgreSQL pod before rollout
  kubernetes.core.k8s_info:
    kubeconfig: "{{ postgres_kubeconfig }}"
    api_version: v1
    kind: Pod
    namespace: "{{ postgres_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=postgres
  register: postgres_existing_pods
  changed_when: false

- name: Read checksums from an existing PostgreSQL cluster
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ postgres_kubeconfig }}"
    namespace: "{{ postgres_namespace }}"
    pod: "{{ postgres_existing_pods.resources[0].metadata.name }}"
    command: psql -At -U postgres -d postgres -c "SHOW data_checksums;"
  register: postgres_existing_checksums
  when: postgres_existing_pods.resources | length > 0
  changed_when: false

- name: Reject an existing PostgreSQL cluster with checksums enabled
  ansible.builtin.assert:
    that: postgres_existing_checksums.stdout | trim == 'off'
    fail_msg: Existing PostgreSQL data checksums are enabled; refusing migration.
  when: postgres_existing_pods.resources | length > 0

- name: Apply PostgreSQL credentials secret
  kubernetes.core.k8s:
    kubeconfig: "{{ postgres_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', 'secret.yml.j2') | from_yaml }}"
  register: postgres_secret_apply
  when: postgres_existing.results[2].resources | length == 0
  no_log: true

- name: Render PostgreSQL manifests from the authoritative base
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/render_manifests.yml"
  vars:
    manifest_service: postgres
    manifest_base: "{{ role_path }}/../../../k0s-services/postgres/kustomize/base"
    manifest_kustomize_command: "{{ postgres_kustomize_command }}"
    manifest_values:
      dataset_path: "{{ postgres_dataset_mountpoint }}"
      node_name: "{{ postgres_node_name }}"
      image: "{{ postgres_image }}"
      memory: "{{ private_cloud.postgres.max_ram }}"
      shared_buffers: "{{ postgres_shared_buffers }}"

- name: Select PostgreSQL manifest stages
  ansible.builtin.set_fact:
    postgres_storage_manifests: >-
      {{ private_cloud_rendered_manifests
         | selectattr("kind", "in", ["PersistentVolume", "PersistentVolumeClaim"]) | list }}
    postgres_workload_manifests: >-
      {{ private_cloud_rendered_manifests
         | rejectattr("kind", "in", ["PersistentVolume", "PersistentVolumeClaim", "Job"]) | list }}
    postgres_pgvector_manifests: >-
      {{ private_cloud_rendered_manifests | selectattr("kind", "equalto", "Job") | list }}

- name: Apply PostgreSQL storage
  kubernetes.core.k8s:
    kubeconfig: "{{ postgres_kubeconfig }}"
    state: present
    definition: "{{ postgres_storage_manifests }}"

- name: Apply PostgreSQL deployment and service
  kubernetes.core.k8s:
    kubeconfig: "{{ postgres_kubeconfig }}"
    state: present
    definition: "{{ postgres_workload_manifests }}"
  no_log: true

- name: Restart PostgreSQL after a credentials Secret change
  kubernetes.core.k8s:
    kubeconfig: "{{ postgres_kubeconfig }}"
    state: patched
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ postgres_service_name }}"
        namespace: "{{ postgres_namespace }}"
      spec:
        template:
          metadata:
            annotations:
              private-cloud.example/credentials-restarted-at: "{{ ansible_date_time.iso8601 }}"
  when: postgres_secret_apply.changed | default(false)
  no_log: true

- name: Wait for PostgreSQL deployment rollout
  kubernetes.core.k8s_info:
    kubeconfig: "{{ postgres_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    name: "{{ postgres_service_name }}"
    namespace: "{{ postgres_namespace }}"
  register: postgres_deployment
  until:
    - postgres_deployment.resources | length > 0
    - postgres_deployment.resources[0].status.observedGeneration | default(0) | int >= postgres_deployment.resources[0].metadata.generation | int
    - postgres_deployment.resources[0].status.updatedReplicas | default(0) | int == postgres_deployment.resources[0].spec.replicas | default(1) | int
    - postgres_deployment.resources[0].status.readyReplicas | default(0) | int == postgres_deployment.resources[0].spec.replicas | default(1) | int
    - postgres_deployment.resources[0].status.availableReplicas | default(0) | int == postgres_deployment.resources[0].spec.replicas | default(1) | int
  retries: 60
  delay: 5
  changed_when: false

- name: Wait for PostgreSQL pod readiness
  kubernetes.core.k8s_info:
    kubeconfig: "{{ postgres_kubeconfig }}"
    api_version: v1
    kind: Pod
    namespace: "{{ postgres_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=postgres
  register: postgres_pods
  until:
    - postgres_pods.resources | length > 0
    - postgres_pods.resources[0].status.containerStatuses | default([]) | selectattr('ready', 'equalto', true) | list | length > 0
  retries: 60
  delay: 5
  changed_when: false

- name: Verify PostgreSQL readiness
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ postgres_kubeconfig }}"
    namespace: "{{ postgres_namespace }}"
    pod: "{{ postgres_pods.resources[0].metadata.name }}"
    command: pg_isready -U postgres -d postgres
  changed_when: false

- name: Apply the PostgreSQL pgvector bootstrap job
  kubernetes.core.k8s:
    kubeconfig: "{{ postgres_kubeconfig }}"
    state: present
    definition: "{{ postgres_pgvector_manifests }}"
  no_log: true

- name: Wait for the PostgreSQL pgvector bootstrap job
  kubernetes.core.k8s_info:
    kubeconfig: "{{ postgres_kubeconfig }}"
    api_version: batch/v1
    kind: Job
    name: postgres-pgvector-086
    namespace: "{{ postgres_namespace }}"
  register: postgres_pgvector_job
  until:
    - postgres_pgvector_job.resources | length > 0
    - postgres_pgvector_job.resources[0].status.succeeded | default(0) | int >= 1
  retries: 60
  delay: 5
  changed_when: false

- name: Read shared PostgreSQL pgvector status
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ postgres_kubeconfig }}"
    namespace: "{{ postgres_namespace }}"
    pod: "{{ postgres_pods.resources[0].metadata.name }}"
    command: >-
      psql -At -U postgres -d postgres -c
      "SELECT COALESCE((SELECT extversion FROM pg_extension WHERE extname = 'vector'), 'absent') || '|' || COALESCE((SELECT default_version FROM pg_available_extensions WHERE name = 'vector'), 'unavailable');"
  register: postgres_pgvector_status
  changed_when: false

- name: Classify shared PostgreSQL pgvector status
  ansible.builtin.set_fact:
    postgres_pgvector_installed_version: "{{ (postgres_pgvector_status.stdout | trim).split('|')[0] }}"
    postgres_pgvector_available_version: "{{ (postgres_pgvector_status.stdout | trim).split('|')[1] }}"

- name: Require the configured pgvector version
  ansible.builtin.assert:
    that: postgres_pgvector_available_version == postgres_pgvector_version
    fail_msg: The shared PostgreSQL image does not provide the configured pgvector version.

- name: Enable pgvector in the PostgreSQL administrator database
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ postgres_kubeconfig }}"
    namespace: "{{ postgres_namespace }}"
    pod: "{{ postgres_pods.resources[0].metadata.name }}"
    command: psql -v ON_ERROR_STOP=1 -At -U postgres -d postgres -c "CREATE EXTENSION vector;"
  when: postgres_pgvector_installed_version == 'absent'
  changed_when: true

- name: Update pgvector in the PostgreSQL administrator database
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ postgres_kubeconfig }}"
    namespace: "{{ postgres_namespace }}"
    pod: "{{ postgres_pods.resources[0].metadata.name }}"
    command: psql -v ON_ERROR_STOP=1 -At -U postgres -d postgres -c "ALTER EXTENSION vector UPDATE;"
  when:
    - postgres_pgvector_installed_version != 'absent'
    - postgres_pgvector_installed_version != postgres_pgvector_version
  changed_when: true

- name: Verify shared PostgreSQL pgvector
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ postgres_kubeconfig }}"
    namespace: "{{ postgres_namespace }}"
    pod: "{{ postgres_pods.resources[0].metadata.name }}"
    command: psql -At -U postgres -d postgres -c "SELECT extversion FROM pg_extension WHERE extname = 'vector';"
  register: postgres_pgvector_effective
  changed_when: false

- name: Assert shared PostgreSQL pgvector
  ansible.builtin.assert:
    that: postgres_pgvector_effective.stdout | trim == postgres_pgvector_version
    fail_msg: The shared PostgreSQL vector extension is not enabled at the configured version.

- name: Read effective PostgreSQL settings
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ postgres_kubeconfig }}"
    namespace: "{{ postgres_namespace }}"
    pod: "{{ postgres_pods.resources[0].metadata.name }}"
    command: >-
      psql -At -U postgres -d postgres -c
      "SELECT pg_size_bytes(current_setting('shared_buffers')), current_setting('full_page_writes'), current_setting('wal_compression'), current_setting('wal_init_zero'), current_setting('wal_recycle'), current_setting('data_checksums');"
  register: postgres_effective_settings
  changed_when: false

- name: Verify effective PostgreSQL tuning
  ansible.builtin.assert:
    that: (postgres_effective_settings.stdout | trim) == ((postgres_shared_buffers_bytes | string) + '|off|off|off|off|off')
    fail_msg: Effective PostgreSQL tuning does not match the migration contract.

- name: Verify PostgreSQL ZFS tuning
  ansible.builtin.command: zfs get -H -o value {{ item.key }} {{ postgres_dataset }}
  loop: "{{ postgres_zfs_properties | dict2items }}"
  register: postgres_zfs_effective
  changed_when: false

- name: Assert PostgreSQL ZFS tuning
  ansible.builtin.assert:
    that: item.stdout | trim == item.item.value
    fail_msg: "PostgreSQL dataset property {{ item.item.key }} is not {{ item.item.value }}."
  loop: "{{ postgres_zfs_effective.results }}"

- name: Verify PostgreSQL quota and reservation
  ansible.builtin.command: zfs get -H -p -o value {{ item }} {{ postgres_dataset }}
  loop:
    - quota
    - reservation
  register: postgres_zfs_capacity
  changed_when: false

- name: Assert PostgreSQL quota and reservation
  ansible.builtin.assert:
    that: item.stdout | int == (private_cloud.postgres.volume_size | human_to_bytes | int)
    fail_msg: "PostgreSQL dataset {{ item.item }} does not match volume_size."
  loop: "{{ postgres_zfs_capacity.results }}"
