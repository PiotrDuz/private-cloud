---
- name: Validate Apache Tika inputs
  ansible.builtin.assert:
    that:
      - private_cloud.tika.storage_size is match('^[1-9][0-9]*[KMGTPE]$')
      - private_cloud.tika.max_ram is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti)$')
    fail_msg: Apache Tika configuration is invalid.

- name: Prepare the Apache Tika kubeconfig
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/kubeconfig.yml"
  vars:
    private_cloud_kubeconfig: "{{ tika_kubeconfig }}"

- name: Resolve a Ready Kubernetes node
  kubernetes.core.k8s_info:
    kubeconfig: "{{ tika_kubeconfig }}"
    api_version: v1
    kind: Node
    name: "{{ ansible_hostname }}"
  register: tika_nodes
  changed_when: false

- name: Select the managed storage node
  ansible.builtin.set_fact:
    tika_node_name: "{{ ansible_hostname }}"

- name: Require the managed storage node to be Ready
  ansible.builtin.assert:
    that:
      - tika_nodes.resources | length == 1
      - >-
        tika_nodes.resources[0].status.conditions | default([])
        | selectattr('type', 'equalto', 'Ready')
        | selectattr('status', 'equalto', 'True') | list | length > 0
    fail_msg: "Managed storage host {{ ansible_hostname }} is not a Ready Kubernetes node for Apache Tika."

- name: Prepare the Apache Tika service dataset
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/service_dataset.yml"
  vars:
    private_cloud_service_name: Apache Tika
    private_cloud_service_dataset: "{{ tika_dataset }}"
    private_cloud_service_dataset_mountpoint: "{{ tika_dataset_mountpoint }}"
    private_cloud_service_storage_size: "{{ private_cloud.tika.storage_size }}"

- name: Prepare Apache Tika dataset permissions
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/service_dataset_permissions.yml"
  vars:
    private_cloud_service_dataset_mountpoint: "{{ tika_dataset_mountpoint }}"
    private_cloud_service_dataset_owner: '35002'
    private_cloud_service_dataset_group: '35002'

- name: Verify the Apache Tika service dataset quota
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/service_dataset_quota.yml"
  vars:
    private_cloud_service_name: Apache Tika
    private_cloud_service_dataset: "{{ tika_dataset }}"
    private_cloud_service_storage_size: "{{ private_cloud.tika.storage_size }}"

- name: Inspect existing Apache Tika storage
  kubernetes.core.k8s_info:
    kubeconfig: "{{ tika_kubeconfig }}"
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ item.namespace | default(omit) }}"
  loop:
    - {api_version: v1, kind: PersistentVolume, name: tika-data}
    - {api_version: v1, kind: PersistentVolumeClaim, name: tika-data, namespace: private-cloud}
  register: tika_existing_storage
  changed_when: false

- name: Reject incompatible Apache Tika persistent storage
  ansible.builtin.assert:
    that:
      - >-
        tika_existing_storage.results[0].resources | length == 0
        or tika_existing_storage.results[0].resources[0].spec.local.path == tika_dataset_mountpoint
      - >-
        tika_existing_storage.results[0].resources | length == 0
        or tika_existing_storage.results[0].resources[0].spec.capacity.storage == tika_pv_capacity
      - >-
        tika_existing_storage.results[0].resources | length == 0
        or tika_node_name in
        tika_existing_storage.results[0].resources[0].spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values
      - >-
        tika_existing_storage.results[1].resources | length == 0
        or tika_existing_storage.results[1].resources[0].spec.resources.requests.storage == tika_pv_capacity
      - >-
        tika_existing_storage.results[1].resources | length == 0
        or tika_existing_storage.results[1].resources[0].spec.volumeName == tika_pv_name
    fail_msg: Existing Apache Tika persistent storage conflicts with the configured local storage.

- name: Render Apache Tika manifests from Jinja templates
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/render_manifests.yml"
  vars:
    manifest_service: tika
    manifest_template_dir: "{{ role_path }}/../../../k0s-services/tika/templates"

- name: Select Apache Tika manifest stages
  ansible.builtin.set_fact:
    tika_storage_manifests: >-
      {{ private_cloud_rendered_manifests
         | selectattr('kind', 'in', ['PersistentVolume', 'PersistentVolumeClaim']) | list }}
    tika_workload_manifests: >-
      {{ private_cloud_rendered_manifests
         | rejectattr('kind', 'in', ['PersistentVolume', 'PersistentVolumeClaim']) | list }}

- name: Apply Apache Tika storage
  kubernetes.core.k8s:
    kubeconfig: "{{ tika_kubeconfig }}"
    state: present
    definition: "{{ tika_storage_manifests }}"

- name: Apply Apache Tika workload
  kubernetes.core.k8s:
    kubeconfig: "{{ tika_kubeconfig }}"
    state: present
    definition: "{{ tika_workload_manifests }}"

- name: Wait for Apache Tika deployment
  kubernetes.core.k8s_info:
    kubeconfig: "{{ tika_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    name: "{{ tika_service_name }}"
    namespace: "{{ tika_namespace }}"
  register: tika_deployment
  until:
    - tika_deployment.resources | length > 0
    - tika_deployment.resources[0].status.observedGeneration | default(0) | int >= tika_deployment.resources[0].metadata.generation | int
    - tika_deployment.resources[0].status.updatedReplicas | default(0) | int == tika_deployment.resources[0].spec.replicas | default(1) | int
    - tika_deployment.resources[0].status.readyReplicas | default(0) | int == tika_deployment.resources[0].spec.replicas | default(1) | int
    - tika_deployment.resources[0].status.availableReplicas | default(0) | int == tika_deployment.resources[0].spec.replicas | default(1) | int
  retries: 60
  delay: 5
  changed_when: false

- name: Wait for Apache Tika service endpoint
  kubernetes.core.k8s_info:
    kubeconfig: "{{ tika_kubeconfig }}"
    api_version: v1
    kind: Endpoints
    name: "{{ tika_service_name }}"
    namespace: "{{ tika_namespace }}"
  register: tika_endpoint
  until: tika_endpoint.resources | length > 0 and (tika_endpoint.resources[0].subsets | default([]) | selectattr('addresses', 'defined') | list | length > 0)
  retries: 60
  delay: 5
  changed_when: false
