---
- name: Verify Apache Tika extracts submitted text
  ansible.builtin.command:
    argv: [python3, "{{ playbook_dir }}/validation/check_application.py"]
    stdin: >-
      {{ {
        'kubeconfig': tika_kubeconfig,
        'namespace': tika_namespace,
        'service': tika_service_name,
        'remote_port': 9998,
        'method': 'PUT',
        'path': '/tika',
        'body': 'private-cloud Tika extraction check',
        'headers': {'Content-Type': 'text/plain'},
        'body_contains': 'private-cloud Tika extraction check'
      } | to_json }}
  register: tika_validation_extraction
  changed_when: false
