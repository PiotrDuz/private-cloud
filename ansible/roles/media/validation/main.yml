---
- name: Wait for the media VPN and application deployments
  kubernetes.core.k8s_info:
    kubeconfig: "{{ media_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    namespace: media
    name: "{{ item }}"
  loop: [media-vpn, sonarr, radarr, prowlarr, flaresolverr, bazarr, jellyfin]
  register: media_validation_deployments
  until:
    - media_validation_deployments.resources | default([]) | length == 1
    - media_validation_deployments.resources[0].status.observedGeneration | default(0) | int >= media_validation_deployments.resources[0].metadata.generation | int
    - media_validation_deployments.resources[0].status.updatedReplicas | default(0) | int == media_validation_deployments.resources[0].spec.replicas | int
    - media_validation_deployments.resources[0].status.availableReplicas | default(0) | int == media_validation_deployments.resources[0].spec.replicas | int
  retries: 60
  delay: 5
  changed_when: false

- name: Resolve the media service endpoints
  kubernetes.core.k8s_info:
    kubeconfig: "{{ media_kubeconfig }}"
    api_version: v1
    kind: Endpoints
    namespace: media
    name: "{{ item }}"
  loop: [media-vpn, sonarr, radarr, prowlarr, qbittorrent, flaresolverr, bazarr, jellyfin]
  register: media_validation_endpoints
  changed_when: false

- name: Require ready endpoints for the media services
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.resources[0].subsets | default([]) | selectattr('addresses', 'defined') | list | length > 0
    fail_msg: "The media service {{ item.item }} has no ready endpoints."
  loop: "{{ media_validation_endpoints.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Verify the WireGuard tunnel is active
  ansible.builtin.command:
    argv: [k0s, kubectl, exec, -n, media, deployment/media-vpn, -c, wireguard, --, ip, -4, address, show, dev, wg0]
  register: media_validation_wireguard_tunnel
  changed_when: false

- name: Require the WireGuard wg0 interface address
  ansible.builtin.assert:
    that: media_validation_wireguard_tunnel.stdout is search('inet ' ~ private_cloud.media.vpn.address | regex_escape)
    fail_msg: The media VPN container has no wg0 interface with the configured address.

- name: Verify the tunnel peer key, endpoint port, keepalive, and handshake
  ansible.builtin.command:
    argv: [python3, "{{ playbook_dir }}/validation/media/check_wireguard_peer.py"]
    stdin: >-
      {{ {
        'interface': 'wg0',
        'peer_public_key': private_cloud.media.vpn.peer_public_key,
        'endpoint_port': private_cloud.media.vpn.endpoint_port,
        'persistent_keepalive': private_cloud.media.vpn.persistent_keepalive
      } | to_json }}
  register: media_validation_wireguard_peer
  until: media_validation_wireguard_peer.rc == 0
  retries: 6
  delay: 10
  changed_when: false

- name: Read the media gateway pod specification
  kubernetes.core.k8s_info:
    kubeconfig: "{{ media_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    namespace: media
    name: media-vpn
  register: media_validation_gateway
  changed_when: false

- name: Require the media gateway to hold only its WireGuard capabilities
  ansible.builtin.assert:
    that:
      - media_validation_gateway.resources | length == 1
      - >-
        (media_validation_gateway.resources[0].spec.template.spec.containers
        | selectattr('name', 'equalto', 'wireguard')
        | map(attribute='securityContext.capabilities.add') | first | sort) == ['CHOWN', 'NET_ADMIN']
      - >-
        (media_validation_gateway.resources[0].spec.template.spec.containers
        | selectattr('name', 'equalto', 'qbittorrent')
        | map(attribute='securityContext.capabilities') | first) == {'drop': ['ALL']}
    fail_msg: The media gateway capabilities differ from the WireGuard minimum, or qBittorrent holds a capability.

- name: Verify each ARR tun2socks process is attached to its only TUN device
  ansible.builtin.command:
    argv:
      - k0s
      - kubectl
      - exec
      - -n
      - media
      - "deployment/{{ item }}"
      - -c
      - vpn-route
      - --
      - /bin/sh
      - -ec
      - |
        set -- $(ip tuntap show | awk -F: 'NF {print $1}')
        [ "$#" -eq 1 ] || exit 1
        [ "$1" = tun0 ] || exit 1
        for comm in /proc/[0-9]*/comm; do
          [ -r "$comm" ] || continue
          [ "$(cat "$comm" 2>/dev/null)" = tun2socks ] || continue
          pid=${comm#/proc/}
          pid=${pid%/comm}
          for fdinfo in /proc/"$pid"/fdinfo/*; do
            grep -Eq '^iff:[[:space:]]*tun0$' "$fdinfo" && exit 0
          done
        done
        exit 1
  loop: [sonarr, radarr, prowlarr, flaresolverr, bazarr]
  changed_when: false

- name: Verify the media UID route through the tunnel
  ansible.builtin.command:
    argv: [k0s, kubectl, exec, -n, media, deployment/media-vpn, -c, wireguard, --, ip, route, get, 1.1.1.1, uid, "{{ media_uid }}"]
  register: media_validation_qbittorrent_route
  changed_when: false

- name: Require qBittorrent's route through wg0
  ansible.builtin.assert:
    that: media_validation_qbittorrent_route.stdout is search('dev wg0')
    fail_msg: qBittorrent traffic is not routed through the WireGuard tunnel.

- name: Read the gateway output firewall
  ansible.builtin.command:
    argv: [k0s, kubectl, exec, -n, media, deployment/media-vpn, -c, wireguard, --, iptables, -S, OUTPUT]
  register: media_validation_gateway_firewall
  changed_when: false

- name: Require the media UID limited to the tunnel, gateway DNS, and replies
  ansible.builtin.assert:
    that: >-
      (media_validation_gateway_firewall.stdout_lines[1:6] | map('regex_replace', ' +$', '') | list) == [
        '-A OUTPUT -m owner --uid-owner ' ~ media_uid ~ ' -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT',
        '-A OUTPUT -d 127.0.0.1/32 -o lo -p tcp -m owner --uid-owner ' ~ media_uid ~ ' -m tcp --dport 53 -j ACCEPT',
        '-A OUTPUT -d 127.0.0.1/32 -o lo -p udp -m owner --uid-owner ' ~ media_uid ~ ' -m udp --dport 53 -j ACCEPT',
        '-A OUTPUT -o wg0 -m owner --uid-owner ' ~ media_uid ~ ' -j ACCEPT',
        '-A OUTPUT -m owner --uid-owner ' ~ media_uid ~ ' -j DROP'
      ]
    fail_msg: The gateway firewall no longer confines qBittorrent to the tunnel.

- name: Verify qBittorrent cannot reach the gluetun control server
  ansible.builtin.command:
    argv: [k0s, kubectl, exec, -n, media, deployment/media-vpn, -c, qbittorrent, --, curl, -sS, -m, '5', -o, /dev/null, http://127.0.0.1:8000/v1/vpn/status]
  register: media_validation_qbittorrent_control
  failed_when: media_validation_qbittorrent_control.rc == 0
  changed_when: false

- name: Read the qBittorrent interface binding
  ansible.builtin.command:
    argv: [k0s, kubectl, exec, -n, media, deployment/media-vpn, -c, qbittorrent, --, cat, /config/qBittorrent/qBittorrent.conf]
  register: media_validation_qbittorrent_configuration
  changed_when: false
  no_log: true

- name: Require qBittorrent bound to wg0 on the forwarded port in anonymous mode without seeding after completion
  ansible.builtin.assert:
    that:
      - "'Session\\Interface=wg0' in media_validation_qbittorrent_configuration.stdout"
      - "'Session\\InterfaceName=wg0' in media_validation_qbittorrent_configuration.stdout"
      - "('Session\\Port=' ~ private_cloud.media.vpn.forwarded_port) in media_validation_qbittorrent_configuration.stdout_lines"
      - "'Session\\GlobalMaxRatio=0' in media_validation_qbittorrent_configuration.stdout"
      - "'Session\\ShareLimitAction=Stop' in media_validation_qbittorrent_configuration.stdout"
      - "'Session\\AnonymousModeEnabled=true' in media_validation_qbittorrent_configuration.stdout"
    fail_msg: qBittorrent has lost its wg0 interface binding, forwarded port, seeding limit, or anonymous mode.
  no_log: true

- name: Read the ARR application process UIDs
  ansible.builtin.command:
    argv: [k0s, kubectl, exec, -n, media, "deployment/{{ 'media-vpn' if item == 'qbittorrent' else item }}", -c, "{{ item }}", --, id, -u]
  loop: [sonarr, radarr, prowlarr, qbittorrent, flaresolverr, bazarr]
  register: media_validation_arr_uids
  changed_when: false

- name: Require ARR application containers on the dedicated media UID
  ansible.builtin.assert:
    that: item.stdout | trim == media_uid | string
    fail_msg: "{{ item.item }} is not running as the dedicated media UID {{ media_uid }}."
  loop: "{{ media_validation_arr_uids.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Resolve ARR service addresses for API validation
  kubernetes.core.k8s_info:
    kubeconfig: "{{ media_kubeconfig }}"
    api_version: v1
    kind: Service
    namespace: media
    name: "{{ item }}"
  loop: [sonarr, radarr, prowlarr, bazarr]
  register: media_validation_arr_services
  changed_when: false

- name: Validate the configured ARR APIs and managed integration settings
  ansible.builtin.command:
    argv: [python3, "{{ playbook_dir }}/validation/media/check_arr.py"]
    stdin: >-
      {{ {
        'addresses': dict(media_validation_arr_services.results | map(attribute='item') | zip(media_validation_arr_services.results | map(attribute='resources') | map('first') | map(attribute='spec.clusterIP'))),
        'datasets': media_datasets,
        'quality_profiles': private_cloud.media.quality_profiles
      } | to_json }}
  changed_when: false
  no_log: true

- name: Read the Jellyfin pod resource configuration
  kubernetes.core.k8s_info:
    kubeconfig: "{{ media_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    namespace: media
    name: jellyfin
  register: media_validation_jellyfin
  changed_when: false

- name: Require the configured Jellyfin memory limit and accelerator mode
  ansible.builtin.assert:
    that:
      - media_validation_jellyfin.resources | length == 1
      - media_validation_jellyfin.resources[0].spec.template.spec.containers | selectattr('name', 'equalto', 'jellyfin') | map(attribute='resources') | map(attribute='limits') | map(attribute='memory') | first == private_cloud.media.max_ram.jellyfin
      - >-
        ('gpu.intel.com/i915' in
         (media_validation_jellyfin.resources[0].spec.template.spec.containers |
          selectattr('name', 'equalto', 'jellyfin') | map(attribute='resources') |
          map(attribute='requests') | first | default({}))) ==
        (private_cloud.stages.intel_gpu | bool)
    fail_msg: Jellyfin memory or Intel GPU configuration does not match the global settings.

- name: Validate Jellyfin's public server API
  ansible.builtin.command:
    argv: [python3, "{{ playbook_dir }}/validation/check_application.py"]
    stdin: >-
      {{ {'kubeconfig': media_kubeconfig, 'namespace': 'media', 'service': 'jellyfin',
          'remote_port': 8096, 'path': '/System/Info/Public',
          'json_keys': ['Version', 'ProductName', 'ServerName'],
          'json_equal': {'StartupWizardCompleted': true}} | to_json }}
  changed_when: false

- name: Verify Jellyfin can encode a short CPU video frame
  ansible.builtin.command:
    argv: [k0s, kubectl, exec, -n, media, deployment/jellyfin, -c, jellyfin, --, /usr/lib/jellyfin-ffmpeg/ffmpeg,
           -hide_banner, -loglevel, error, -f, lavfi, -i, 'color=c=black:s=32x32:r=1',
           -t, '1', -c:v, libx264, -f, 'null', '-']
  changed_when: false

- name: Read the home WAN address from the host
  ansible.builtin.uri:
    url: "{{ private_cloud.networking.public_ip_url }}"
    return_content: true
  register: media_validation_host_address
  changed_when: false

- name: Read the guarded media exit address through the VPN
  ansible.builtin.command:
    argv: [k0s, kubectl, exec, -n, media, deployment/media-vpn, -c, qbittorrent, --, curl, -fsS, --max-time, '30', "{{ private_cloud.networking.public_ip_url }}"]
  register: media_validation_vpn_address
  changed_when: false

- name: Require guarded media traffic to exit through the VPN provider
  ansible.builtin.assert:
    that:
      - media_validation_vpn_address.stdout | trim is match('^[0-9]{1,3}([.][0-9]{1,3}){3}$')
      - media_validation_vpn_address.stdout | trim != media_validation_host_address.content | trim
    fail_msg: Guarded media traffic does not exit through the VPN provider.
